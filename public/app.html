<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>플래시카드</title>
<style>
:root{
  --desk:#2B3A4A; --desk-deep:#22303D; --paper:#FBFAF7; --ink:#1E242B;
  --hl:#FFE34D; --wrong:#D64550; --right:#2E75B6; --muted:#7A8694; --line:#E4E0D6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:linear-gradient(160deg,var(--desk) 0%,var(--desk-deep) 100%);
  color:var(--ink); display:flex; flex-direction:column; align-items:center;
  min-height:100dvh; padding:14px 14px 20px;
}
.app{width:100%;max-width:560px;display:flex;flex-direction:column;flex:1;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;color:#DDE5EC;margin-bottom:10px}
.topbar h1{font-size:15px;font-weight:800;letter-spacing:-.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.12);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill b{color:var(--hl)}
button.iconbtn{background:rgba(255,255,255,.12);border:none;color:#DDE5EC;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.progress{height:5px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--hl);width:0%;transition:width .3s ease;border-radius:99px}
.card{
  background:var(--paper); border-radius:18px; flex:1; min-height:0;
  box-shadow:0 14px 34px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.06) inset;
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gcol,#B9C2CC)}
.cardhead{display:flex;align-items:center;gap:8px;padding:16px 18px 0 22px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:900;color:#fff;border-radius:6px;padding:3px 9px;background:var(--gcol,#8B97A3)}
.badge.dim{background:#C7CDD4;color:#5B6672}
.theme{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.weakchip{font-size:11px;font-weight:900;color:#fff;background:var(--wrong);border-radius:99px;padding:2.5px 9px}
.qno{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;user-select:none}
.qno .jarrow{color:var(--right)}
.jumpgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px}
.jumpgrid button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 0;font-size:13px;font-weight:800;color:#5B6672;cursor:pointer;position:relative}
.jumpgrid button.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.jumpgrid button.ok{border-color:var(--right);color:var(--right)}
.jumpgrid button.no{border-color:var(--wrong);color:var(--wrong)}
.jumpgrid button.weak::after{content:"⭐";position:absolute;top:-7px;right:-5px;font-size:10px}
.jumpgrid button.todo{border-style:dashed;border-color:var(--muted);color:var(--muted);background:#F7F8FA}
.jumpgrid button.todo::before{content:"";position:absolute;top:5px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.gotoTodo{width:100%;margin-top:12px;border:1.5px dashed var(--muted);border-radius:12px;padding:12px;font-size:14px;font-weight:900;background:#fff;color:#5B6672;cursor:pointer}
.gotoTodo:active{transform:translateY(1px)}
.gotoTodo:disabled{opacity:.4;cursor:default}
.jumplegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;font-weight:700;color:var(--muted)}
.jumplegend b{font-weight:900}
.qscroll{flex:1;overflow-y:auto;padding:12px 20px 16px 22px}
.qtext{font-size:17.5px;line-height:1.62;font-weight:600;word-break:keep-all;white-space:pre-wrap}
.qtext mark{background:linear-gradient(transparent 42%,var(--hl) 42%);padding:0 2px;border-radius:2px}
.qtext mark.kwr{background:linear-gradient(transparent 42%,#ffc9c9 42%);color:var(--wrong);font-weight:800}
.src{margin-top:10px;font-size:12px;color:var(--muted);font-weight:700}
.concept{display:none;background:#FFF9DE;border:1.5px solid #EFDD8F;border-radius:12px;padding:14px 16px;margin-bottom:4px}
.concept.show{display:block;animation:rise .28s ease}
.concept .clabel{font-size:12px;font-weight:900;color:#8A7B1E;letter-spacing:.5px;margin-bottom:6px}
.concept .cbody{font-size:15.5px;line-height:1.66;font-weight:600;word-break:keep-all}
.concept .cbody mark{background:linear-gradient(transparent 42%,var(--hl) 42%);padding:0 2px;border-radius:2px;font-weight:800}
.result{border-top:1.5px dashed var(--line);padding:14px 20px 16px 22px;display:none;animation:rise .28s ease}
.result.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.verdict .mark{font-size:22px;font-weight:900}
.verdict.ok .mark{color:var(--right)} .verdict.no .mark{color:var(--wrong)}
.verdict .anslabel{font-size:14px;font-weight:800}
.anschip{font-size:14px;font-weight:900;border-radius:8px;padding:2px 10px;color:#fff}
.anschip.O{background:var(--right)} .anschip.X{background:var(--wrong)} .anschip.etc{background:#5B6672}
.exp{font-size:14.5px;line-height:1.66;word-break:keep-all;white-space:pre-wrap}
.exp mark{background:linear-gradient(transparent 42%,var(--hl) 42%);padding:0 2px;border-radius:2px;font-weight:800}
.exp .trap{color:var(--wrong);font-weight:800}
.exp .trap mark{background:linear-gradient(transparent 40%,var(--hl) 40%);padding:0 2px;border-radius:2px;color:var(--wrong)}
.exp .fix{color:var(--right)} .exp .fix b{font-weight:900}
.linkbox{margin-top:14px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#F4F8FF}
.linklabel{font-size:12px;font-weight:900;color:#2B5D8A;margin-bottom:8px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}
.linkrow a{display:inline-block;text-decoration:none;font-size:13px;font-weight:800;color:#1E4A73;background:#fff;border:1.5px solid #BcD5EE;border-radius:10px;padding:8px 11px;cursor:pointer}
.linkrow a:active{transform:translateY(1px)}
.slinkrow{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.slink{display:flex;align-items:center;gap:9px;text-decoration:none;background:#fff;border:1.5px solid #BcD5EE;border-radius:11px;padding:9px 11px;cursor:pointer}
.slink:active{transform:translateY(1px)}
.slink .opt{flex:0 0 auto;width:23px;height:23px;line-height:23px;text-align:center;border-radius:50%;background:#2B5D8A;color:#fff;font-size:12.5px;font-weight:900}
.slink .lb{flex:1;font-size:13px;font-weight:800;color:#1E4A73;word-break:keep-all;line-height:1.4}
.slink .go{flex:0 0 auto;font-size:11.5px;font-weight:900;color:#6E8CA8}
.backbar{width:100%;border:none;background:#2B5D8A;color:#fff;font-size:13.5px;font-weight:800;padding:11px 14px;text-align:left;cursor:pointer;border-radius:0}
.backbar:active{opacity:.85}
.markbtn{margin-top:14px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:800;color:#8A7B1E;cursor:pointer;width:100%}
.markbtn.on{background:#FFF3C4;border-color:#EFDD8F;color:#7A6B00}
.askbtn{margin-top:9px;border:none;background:#229ED9;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:800;color:#fff;cursor:pointer;width:100%}
.askbtn:active{opacity:.8}
.asktoast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(20,26,32,.94);color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;z-index:99;white-space:nowrap}
.done .weakstart{background:#D9A400;color:#fff}
.controls{margin-top:14px}
.oxrow{display:flex;gap:12px}
.oxrow button{flex:1;border:none;border-radius:16px;padding:20px 0;font-size:30px;font-weight:900;cursor:pointer;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .06s ease}
.oxrow button:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btnO{background:var(--right)} .btnX{background:var(--wrong)}
.numrow{display:flex;gap:8px}
.numrow button{flex:1;border:none;border-radius:14px;padding:16px 0;font-size:19px;font-weight:900;color:#fff;background:#5B6672;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.numrow button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.studybtn{width:100%;border:none;border-radius:16px;padding:20px 0;font-size:17px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);display:none}
.studybtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.nextbtn{width:100%;border:none;border-radius:16px;padding:18px 0;font-size:17px;font-weight:900;cursor:pointer;background:var(--hl);color:#3B3400;box-shadow:0 6px 0 rgba(0,0,0,.25);display:none}
.nextbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.done{display:none;flex:1;background:var(--paper);border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.35);overflow-y:auto}
.done h2{font-size:22px;font-weight:900;margin-bottom:8px}
.done .score{font-size:46px;font-weight:900;margin:10px 0 4px}
.done .score small{font-size:18px;color:var(--muted)}
.done p{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:18px}
.done .btns{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto 20px}
.done button{border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;cursor:pointer}
.done .retryWrong{background:var(--wrong);color:#fff}
.done .restart{background:var(--ink);color:#fff}
.done .nextch{background:var(--right);color:#fff;display:none}
.histbox{max-width:340px;margin:0 auto;text-align:left}
.histbox h4{font-size:13px;font-weight:900;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
.hrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:7px 10px;border-radius:10px;background:#F1EEE5;margin-bottom:6px}
.hrow .hn{font-weight:900;color:var(--muted)}
.hrow .hr8{margin-left:auto;font-weight:900}
.hrow .hw{color:var(--wrong)}
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.sheetwrap.show{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px 26px;max-height:78dvh;overflow-y:auto}
.sheet h3{font-size:15px;font-weight:900;margin:14px 0 8px}
.sheet h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;color:#5B6672;cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button.g.on{background:var(--gc);border-color:var(--gc);color:#fff}
.sheet .apply{width:100%;margin-top:18px;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:900;background:var(--hl);color:#3B3400;cursor:pointer}
.togglerow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:14px;font-weight:800}
.togglerow small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.sw{width:48px;height:28px;border-radius:99px;background:#C7CDD4;position:relative;cursor:pointer;transition:.2s;border:none;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--right)} .sw.on::after{left:23px}
/* 이어하기 오버레이 */
.resume{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:center;justify-content:center;padding:20px}
.resume.show{display:flex}
.rbox{background:var(--paper);border-radius:18px;padding:26px 22px;max-width:380px;width:100%;text-align:center}
.rbox h3{font-size:18px;font-weight:900;margin-bottom:6px}
.rbox p{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:18px}
.rbox button{width:100%;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:9px}
.rbox .go{background:var(--hl);color:#3B3400}
.rbox .fresh{background:var(--ink);color:#fff}
/* 챕터 핵심 요약 오버레이 */
.introhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.introhead h3{margin:0}
.introx{border:none;background:rgba(0,0,0,.06);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:15px;font-weight:900;cursor:pointer}
.introbody{font-size:14.5px;line-height:1.72;color:var(--ink)}
.introbody h4{font-size:14.5px;font-weight:900;margin:16px 0 7px;color:#2E75B6;display:flex;align-items:center;gap:6px}
.introbody h4:first-child{margin-top:8px}
.introbody p{margin:0 0 9px}
.introbody ul{margin:0 0 10px;padding-left:4px;list-style:none}
.introbody li{position:relative;padding-left:18px;margin-bottom:7px}
.introbody li::before{content:"·";position:absolute;left:5px;top:-1px;color:#2E75B6;font-weight:900}
.introbody b{color:#C0392B;font-weight:800}
.introbody .tip{background:#fff7e6;border-left:3px solid #D9A400;border-radius:8px;padding:9px 12px;margin:10px 0}
.introbody .tip b{color:#9a7400}
.introhbtns{display:flex;gap:6px;align-items:center}
.ttsbtn{border:none;background:#2E75B6;color:#fff;border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.ttsbtn.on{background:#C0392B}
.introbody .ttsread{background:#ffe98a;border-radius:6px;box-shadow:0 0 0 5px #ffe98a;transition:background .15s ease}
.introbody h4.ttsread{box-shadow:0 0 0 4px #ffe98a}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1 id="chTitle">불러오는 중…</h1>
    <span class="pill" id="roundPill" style="display:none"></span>
    <span class="pill" id="scorePill">⭕ <b id="okCnt">0</b> · ❌ <b id="noCnt">0</b></span>
    <button class="iconbtn" onclick="location.href='index.html'">목차</button>
    <button class="iconbtn" id="introBtn" style="display:none">📖요약</button>
    <button class="iconbtn" id="weakBtn">⭐취약</button>
    <button class="iconbtn" id="filterBtn">필터</button>
  </div>
  <div class="progress"><i id="progBar"></i></div>
  <button class="backbar" id="backBar" style="display:none"></button>

  <div class="card" id="card">
    <div class="cardhead">
      <span class="badge" id="gradeBadge">-</span>
      <span class="theme" id="themeLbl"></span>
      <span class="weakchip" id="weakChip" style="display:none"></span>
      <span class="qno" id="qnoLbl"></span>
    </div>
    <div class="qscroll">
      <div class="concept" id="conceptBox"><div class="clabel">💡 핵심 개념 — 읽고 외운 뒤 문제로 확인</div><div class="cbody" id="conceptBody"></div></div>
      <div class="qtext" id="qText"></div>
      <div class="src" id="srcLbl"></div>
      <div class="result" id="result">
        <div class="verdict" id="verdict">
          <span class="mark" id="vMark"></span>
          <span class="anslabel">정답:</span>
          <span class="anschip" id="ansChip"></span>
        </div>
        <div class="exp" id="expBox"></div>
        <div class="linkbox" id="linkBox" style="display:none">
          <div class="linklabel" id="linkLabel">🔗 연관 OX 문제 바로가기</div>
          <div class="slinkrow" id="slinkRow"></div>
          <div class="linkrow" id="linkRow"></div>
        </div>
        <button class="markbtn" id="markBtn"></button>
        <button class="askbtn" id="askBtn">💬 이 문제 텔레그램으로 질문하기</button>
      </div>
    </div>
  </div>

  <div class="done" id="doneBox">
    <h2>학습 완료 🚒</h2>
    <div class="score"><span id="finalScore">0</span><small> / <span id="finalTotal">0</span></small></div>
    <p id="doneMsg"></p>
    <div class="btns">
      <button class="nextch" id="nextChBtn">다음 챕터 →</button>
      <button class="weakstart" id="weakStartBtn">⭐ 체크·취약 문제만 풀기</button>
      <button class="retryWrong" id="retryWrongBtn">❌ 이번 오답만 다시 풀기</button>
      <button class="restart" id="restartBtn">처음부터 다시</button>
    </div>
    <div class="histbox" id="histBox" style="display:none">
      <h4>📈 회차 기록</h4>
      <div id="histList"></div>
    </div>
  </div>

  <div class="controls">
    <div class="oxrow" id="oxRow">
      <button class="btnO" data-a="O">O</button>
      <button class="btnX" data-a="X">X</button>
    </div>
    <div class="numrow" id="numRow" style="display:none">
      <button data-a="①">①</button><button data-a="②">②</button><button data-a="③">③</button><button data-a="④">④</button><button data-a="⑤">⑤</button>
    </div>
    <button class="studybtn" id="studyBtn">개념 확인 완료 → 문제 풀기</button>
    <button class="nextbtn" id="nextBtn">다음 문제 →</button>
  </div>
</div>

<div class="sheetwrap" id="sheetWrap">
  <div class="sheet">
    <h3>학습 모드</h3>
    <div class="chips" id="modeChips">
      <button data-m="quiz" class="on">문제 먼저 풀기 (실전)</button>
      <button data-m="learn">개념 먼저 보기 (학습)</button>
    </div>
    <h3>유형</h3><div class="chips" id="themeChips"></div>
    <h3>등급</h3><div class="chips" id="gradeChips"></div>
    <div class="togglerow" style="margin-top:14px"><span>미완료만<small>아직 안 푼 문항만 (진도 채우기)</small></span><button class="sw" id="unsolvedOnlySw"></button></div>
    <div class="togglerow"><span>취약 문제만<small>틀렸거나 ⭐체크한 문제</small></span><button class="sw" id="weakOnlySw"></button></div>
    <div class="togglerow"><span>취약 문제부터<small>누적 오답·체크 우선 정렬(섞기보다 우선)</small></span><button class="sw" id="weakFirstSw"></button></div>
    <div class="togglerow"><span>문제 순서 섞기</span><button class="sw" id="shuffleSw"></button></div>
    <button class="apply" id="applyBtn">이 조건으로 새로 시작</button>
  </div>
</div>

<div class="sheetwrap" id="jumpWrap">
  <div class="sheet">
    <h3>문항 이동 <small style="font-weight:600;color:var(--muted)">— 번호를 눌러 바로 이동</small></h3>
    <button class="gotoTodo" id="gotoTodoBtn">⏭️ 안 푼 문제로 이동</button>
    <div class="jumpgrid" id="jumpGrid"></div>
    <div class="jumplegend">
      <span><b style="color:var(--right)">파랑</b> 맞힘</span>
      <span><b style="color:var(--wrong)">빨강</b> 틀림</span>
      <span>● 안 푼 문제</span>
      <span>⭐ 취약·체크</span>
      <span><b style="color:var(--ink)">검정</b> 현재</span>
    </div>
  </div>
</div>

<div class="resume" id="resumeBox">
  <div class="rbox">
    <h3>풀던 기록이 있습니다</h3>
    <p id="resumeMsg"></p>
    <button class="go" id="resumeGo">이어서 풀기</button>
    <button class="fresh" id="resumeFresh">처음부터 새로 시작</button>
  </div>
</div>

<div class="sheetwrap" id="introWrap">
  <div class="sheet introsheet">
    <div class="introhead"><h3 id="introTitle">📖 이 챕터 핵심 요약</h3>
      <div class="introhbtns"><button class="ttsbtn" id="lvlBtn" style="display:none">📚 상세</button><button class="ttsbtn" id="ttsBtn">🔊 읽어주기</button><button class="introx" id="introClose">✕</button></div></div>
    <div class="introbody" id="introBody"></div>
    <button class="apply" id="introStart">읽었어요 · 문제 풀기 →</button>
  </div>
</div>

<script>
let QUESTIONS = [];
const CH = new URLSearchParams(location.search).get("ch") || "";
const LSKEY = "fc:" + CH;
const GC = {"S":"#C00000","A":"#ED7D31","B":"#D9A400","C":"#2E75B6","기":"#70AD47","인":"#7030A0","소":"#D64550","Z":"#7F7F7F"};

/* ── 클라우드 동기화 (기기 간 진도 공유) ── */
const DBURL = "https://work-schedule-dash-4ceb2-default-rtdb.firebaseio.com";
const DEFAULT_SYNC = "kmj";   // 코드 미설정 기기는 자동으로 이 코드 사용 (index.html과 동일)
const SYNC = (function(){
  const c = (localStorage.getItem("fc:synccode") || "").trim();
  if(c) return c;
  if(localStorage.getItem("fc:syncoff") === "1") return "";
  try{ localStorage.setItem("fc:synccode", DEFAULT_SYNC); }catch(e){}
  return DEFAULT_SYNC;
})();
function cloudUrl(p){ return `${DBURL}/flashcards/${encodeURIComponent(SYNC)}/${p}.json`; }
let _pushTimer=null;
function pushCloud(){
  if(!SYNC || !CH) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>{
    fetch(cloudUrl("ch/"+CH), {method:"PUT", body:JSON.stringify(S)}).catch(()=>{});
  }, 1200);
}
async function pullCloud(){
  if(!SYNC || !CH) return;
  try{
    const r = await fetch(cloudUrl("ch/"+CH), {cache:"no-store"});
    if(!r.ok) return;
    const c = await r.json();
    if(c && (c._at||0) > (S._at||0)){
      S = Object.assign({rounds:0,best:0,last:0,wrongNos:[],history:[],qstat:{},prog:null}, c);
      if(!S.qstat) S.qstat={};
      if(!S.history) S.history=[];
      try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){}
    }
  }catch(e){}
}
let _optTimer=null;
function pushOpts(){
  if(!SYNC) return;
  clearTimeout(_optTimer);
  _optTimer = setTimeout(()=>{
    fetch(cloudUrl("opts"), {method:"PUT", body:JSON.stringify(OPT)}).catch(()=>{});
  }, 800);
}
async function pullOpts(){
  if(!SYNC) return;
  try{
    const r = await fetch(cloudUrl("opts"), {cache:"no-store"});
    if(!r.ok) return;
    const c = await r.json();
    if(c && (c._at||0) > (OPT._at||0)){
      OPT = Object.assign(OPT, c);
      if(!OPT.themes) OPT.themes={};
      try{ localStorage.setItem(OPTKEY, JSON.stringify(OPT)); }catch(e){}
      // 파생 변수 갱신 (필터/모드 UI 반영용)
      selGrades = new Set(OPT.grades||[]);
      selThemes = new Set((OPT.themes&&OPT.themes[CH])||[]);
      mode = OPT.mode||"quiz";
      shuffleOn = OPT.shuffle!==false;
      weakOnlyOn = !!OPT.weakOnly;
      weakFirstOn = !!OPT.weakFirst;
      unsolvedOnlyOn = !!OPT.unsolvedOnly;
    }
  }catch(e){}
}
function applyToggleUI(){
  document.querySelectorAll("#modeChips button").forEach(b=>b.classList.toggle("on", b.dataset.m===mode));
  const setSw=(id,on)=>{ const e=$(id); if(e) e.classList.toggle("on", on); };
  setSw("shuffleSw", shuffleOn); setSw("weakOnlySw", weakOnlyOn); setSw("weakFirstSw", weakFirstOn); setSw("unsolvedOnlySw", unsolvedOnlyOn);
}

/* ── 저장 구조 ──
S = { rounds, best, last, when, wrongNos,           // 요약
      history: [{n, when, total, ok, rate, wrongNos}],  // 회차별 기록
      qstat: { "문항no": {s:본 횟수, w:틀린 횟수} },      // 문항별 누적
      prog: {mode, nos, idx, ans:[[no,a,correct]], ok, no} }  // 진행중 세션
*/
let S = { rounds:0, best:0, last:0, wrongNos:[], history:[], qstat:{}, prog:null };
try { const raw = JSON.parse(localStorage.getItem(LSKEY) || "null"); if(raw) S = Object.assign(S, raw); } catch(e) {}
if(!S.qstat) S.qstat = {};
if(!S.history) S.history = [];
function save(){ if(CH){ S._at=Date.now(); try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} pushCloud(); } }

/* 오늘 푼 문항수(전 챕터 공통) — 날짜별 누적 카운트 */
function bumpDaily(){
  try{
    const k="fc:daily";
    const d=JSON.parse(localStorage.getItem(k)||"{}");
    const t=new Date();
    const key=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    d[key]=(d[key]||0)+1;
    const keys=Object.keys(d).sort(); while(keys.length>1200){ delete d[keys.shift()]; } // 약 3년치 날짜 누적 보관
    localStorage.setItem(k, JSON.stringify(d));
    pushDaily(d);
  }catch(e){}
}
/* 학습 날짜 기록을 클라우드에 누적 병합 (기기 간 유지) */
let _dailyTimer=null;
function pushDaily(local){
  if(!SYNC) return;
  clearTimeout(_dailyTimer);
  _dailyTimer=setTimeout(async ()=>{
    try{
      let cloud={};
      const r=await fetch(cloudUrl("daily"),{cache:"no-store"});
      if(r.ok){ cloud=(await r.json())||{}; }
      const merged=Object.assign({},cloud);
      for(const key in local){ merged[key]=Math.max(cloud[key]||0, local[key]||0); }
      try{ localStorage.setItem("fc:daily", JSON.stringify(merged)); }catch(e){}
      await fetch(cloudUrl("daily"),{method:"PUT",body:JSON.stringify(merged)});
    }catch(e){}
  }, 1500);
}

/* 필터 옵션 전역 저장 (챕터 간 유지) */
const OPTKEY = "fc:opts";
let OPT = { grades:[], mode:"quiz", shuffle:true, weakOnly:false, weakFirst:false, themes:{} };
try { const o=JSON.parse(localStorage.getItem(OPTKEY)||"null"); if(o) OPT=Object.assign(OPT,o); }catch(e){}
if(!OPT.themes) OPT.themes={};
function saveOpt(){
  OPT.grades=[...selGrades];
  OPT.themes[CH]=[...selThemes];
  OPT.mode=mode; OPT.shuffle=shuffleOn; OPT.weakOnly=weakOnlyOn; OPT.weakFirst=weakFirstOn; OPT.unsolvedOnly=unsolvedOnlyOn;
  OPT._at=Date.now();
  try{ localStorage.setItem(OPTKEY, JSON.stringify(OPT)); }catch(e){}
  pushOpts();
}

let deck=[], idx=0, ok=0, no=0, wrongs=[], answers=[];
let shuffleOn = OPT.shuffle!==false, mode = OPT.mode || "quiz";
let selThemes = new Set((OPT.themes&&OPT.themes[CH])||[]);
let selGrades = new Set(OPT.grades||[]);
let weakOnlyOn = !!OPT.weakOnly, weakFirstOn = !!OPT.weakFirst;
let unsolvedOnlyOn = !!OPT.unsolvedOnly;

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const qw=no=>(S.qstat[no]&&S.qstat[no].w)||0;
const qmark=no=>!!(S.qstat[no]&&S.qstat[no].m);           // 사용자가 직접 체크한 문제
const isWeak=no=>qw(no)>0 || qmark(no);                   // 취약 = 틀렸거나 체크한 문제
const isSolved=no=>!!(S.qstat[no]&&S.qstat[no].s>0);      // 한 번이라도 푼 문항
const weakWeight=no=>qw(no)*10 + (qmark(no)?5:0);         // 취약 우선 정렬 가중치
function toggleMark(no){
  const st = S.qstat[no] || (S.qstat[no]={s:0,w:0});
  st.m = st.m?0:1; save();
}
function renderWeakChip(q){
  const el=$("weakChip"), w=qw(q.no), m=qmark(q.no);
  if(w>0){ el.style.display=""; el.textContent = m?`누적 오답 ${w}회 · ⭐체크`:`누적 오답 ${w}회`; }
  else if(m){ el.style.display=""; el.textContent="⭐ 체크한 문제"; }
  else el.style.display="none";
}
function renderMarkBtn(q){
  const mk=$("markBtn"), on=qmark(q.no);
  mk.classList.toggle("on", on);
  mk.textContent = on ? "⭐ 체크됨 — 취약 목록에 포함 (해제하려면 탭)" : "☆ 이 문제 체크하기 (헷갈렸어요)";
  mk.onclick=()=>{ toggleMark(q.no); renderMarkBtn(q); renderWeakChip(q); };
}

/* ── 텔레그램으로 바로 질문 (Firebase 큐 → 봇이 바로 답변) ── */
const ASK_URL = "https://work-schedule-dash-4ceb2-default-rtdb.firebaseio.com/flashcards/ask.json";
function toast(msg){
  const t=document.createElement("div"); t.className="asktoast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function renderAskBtn(q){
  const b=$("askBtn");
  b.disabled=false;
  b.textContent="💬 이 문제 텔레그램으로 질문하기";
  b.onclick=async()=>{
    const myQ = prompt("무엇이 궁금하세요?\n(비워두면 '왜 이렇게 되는지 설명해줘'로 보냅니다)", "");
    if(myQ===null) return;
    const payload = {
      ch: (document.getElementById("chTitle")||{}).textContent || CH || "",
      no: q.no || "", q: q.q || "", ans: q.ans || "",
      exp: q.exp || "", src: q.src || "",
      myq: myQ.trim(),
      link: location.origin + location.pathname + "?ch=" + encodeURIComponent(CH||"") + "&q=" + encodeURIComponent(q.no||""),
      t: Date.now()
    };
    b.disabled=true; b.textContent="📨 전송 중...";
    try{
      const r = await fetch(ASK_URL, {method:"POST", body: JSON.stringify(payload)});
      if(!r.ok) throw new Error(r.status);
      b.textContent="✅ 전송됨 — 텔레그램 확인";
      toast("질문 전송 완료 · 텔레그램으로 답변이 갑니다");
    }catch(e){
      b.disabled=false; b.textContent="⚠️ 전송 실패 — 다시 시도";
      toast("전송 실패: " + e.message);
    }
  };
}

function updateRoundPill(){
  const p=$("roundPill");
  // 덱 전체가 이미 풀린 상태면 '재도전 중'임을 명시해 낮은 진행수가 후퇴로 보이지 않게 한다
  const redo = deck.length>0 && deck.every(q=>isSolved(q.no));
  if(S.rounds){
    p.style.display="";
    p.textContent = redo ? `✅ ${S.rounds}회독 완료 · 재도전 중` : `${S.rounds}회독 · 최고 ${S.best}%`;
  }
}
function hl(escaped, kws, reds){
  const rl=(Array.isArray(reds)?reds:[]).filter(Boolean);
  const kl=(Array.isArray(kws)?kws:[]).filter(Boolean);
  const all=[...new Set([...rl,...kl])];
  if(!all.length) return escaped;
  const rset=new Set(rl.map(k=>esc(k)));
  const parts=all.sort((a,b)=>b.length-a.length)
     .map(k=>esc(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp('('+parts.join('|')+')','g');
  return escaped.replace(re,m=>rset.has(m)?'<mark class="kwr">'+m+'</mark>':'<mark>'+m+'</mark>');
}
function conceptClean(exp){
  let t=(exp||"").trim();
  if(!t) return "";
  if(t.includes("[틀린 부분]")){
    if(t.includes("→")) t=t.slice(t.indexOf("→")+1).trim();
    else t=t.replace(/\[틀린 부분\]\s*/g,"").trim();
  }
  t=t.replace(/^정답\s*[①-⑤]\s*[:：]\s*/, "");
  t=t.replace(/\s*\([^()]*[○×OXＯＸ✓✗∘][^()]*\)/g,"");   // (×) (X) (①X) (○) 등 정답표시 제거
  t=t.replace(/[○×✓✗∘]/g,"");                            // 남은 verdict 기호 제거
  const XWORDS=["틀리다","틀렸다","틀림","틀린 지문","틀린 서술","옳지 않","잘못된 지문","틀린 것이다","정답표","정답은 O","정답은 X","옳은 지문이 아니다","판례에 반","옳은 지문이다","맞는 지문이다","옳은 설명이다"];
  const parts=t.split(/(?<=[.)])\s+/);
  t=parts.map(s=>s.trim()).filter(s=>s && !XWORDS.some(w=>s.includes(w))).join(" ").trim();
  t=t.replace(/(?<![A-Za-z가-힣])[XO](?=이다|가 |로 |이나|임|$|[)\s.,])/g,"");
  t=t.replace(/(?<![A-Za-z가-힣])[XO](?![A-Za-z가-힣])/g,"");
  t=t.replace(/\s{2,}/g," ").replace(/\s+([.,)])/g,"$1");
  return t.trim();
}
function trapPhrase(exp){
  const m = exp.match(/\[틀린 부분\]\s*'([^']+)'/);
  return m ? m[1] : null;
}
function renderExp(exp, kws){
  if(exp.startsWith("[틀린 부분]") && exp.includes("→")){
    const i = exp.indexOf("→");
    let head = esc(exp.slice(0,i).trim());
    const tail = hl(esc(exp.slice(i+1).trim()), kws);
    head = head.replace(/'([^']+)'/, "'<mark>$1</mark>'");
    return `<span class="trap">${head}</span> <span class="fix"><b>→</b> ${tail}</span>`;
  }
  return hl(esc(exp), kws);
}

function saveProg(){
  S.prog = { mode, nos: deck.map(q=>q.no), idx,
             ans: answers.map((a,i)=>a?[deck[i].no,a.a,a.correct]:null).filter(Boolean),
             ok, no };
  save();
}
function clearProg(){ S.prog=null; save(); }

function buildDeck(){
  deck = QUESTIONS.filter(q=>
    (selThemes.size===0 || selThemes.has(q.theme)) &&
    (selGrades.size===0 || selGrades.has(q.grade)) &&
    (!weakOnlyOn || isWeak(q.no)) &&
    (!unsolvedOnlyOn || !isSolved(q.no)));
  if(unsolvedOnlyOn && deck.length===0){
    alert("이 조건에서 안 푼 문항이 없습니다. 🎉\n'미완료만'을 끄고 다시 시작합니다.");
    unsolvedOnlyOn=false; const s=$("unsolvedOnlySw"); if(s) s.classList.remove("on"); saveOpt();
    return buildDeck();
  }
  if(weakFirstOn){
    deck=[...deck].sort((a,b)=>weakWeight(b.no)-weakWeight(a.no));
  } else if(shuffleOn){
    deck=[...deck];
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  }
  idx=0; ok=0; no=0; wrongs=[]; answers=[];
  clearProg();
  $("doneBox").style.display="none";
  $("card").style.display="flex";
  updateRoundPill();
  show();
}
function startWeakDeck(){
  const wd = QUESTIONS.filter(q=>isWeak(q.no)).sort((a,b)=>weakWeight(b.no)-weakWeight(a.no));
  if(!wd.length){ alert("틀렸거나 ⭐체크한 문제가 아직 없습니다.\n문제를 풀거나 결과 화면에서 체크해 보세요."); return; }
  deck=[...wd]; idx=0; ok=0; no=0; wrongs=[]; answers=[];
  clearProg();
  $("sheetWrap").classList.remove("show");
  $("resumeBox").classList.remove("show");
  $("doneBox").style.display="none"; $("card").style.display="flex";
  show();
}
function resumeSession(p){
  mode = p.mode || "quiz";
  const byNo = Object.fromEntries(QUESTIONS.map(q=>[q.no,q]));
  deck = p.nos.map(n=>byNo[n]).filter(Boolean);
  answers = new Array(deck.length);
  ok=0; no=0; wrongs=[];
  const ansByNo = Object.fromEntries((p.ans||[]).map(a=>[a[0],a]));
  deck.forEach((q,i)=>{
    const a = ansByNo[q.no];
    if(a){ answers[i]={a:a[1],correct:a[2]}; if(a[2]) ok++; else { no++; wrongs.push(q); } }
  });
  idx = Math.min(p.idx||0, deck.length);
  let firstOpen = answers.findIndex(a=>!a);
  if(firstOpen===-1) firstOpen = deck.length;
  if(!answers[idx] && idx>firstOpen) idx = firstOpen;
  $("doneBox").style.display="none";
  $("card").style.display="flex";
  document.querySelectorAll("#modeChips button").forEach(b=>b.classList.toggle("on", b.dataset.m===mode));
  updateRoundPill();
  show();
}

// 덱의 모든 문항에 답이 채워졌는지 (중간 문항을 나중에 풀어 채운 경우 포함)
const allAnswered=()=>deck.length>0 && answers.filter(Boolean).length>=deck.length;

function show(){
  updateHud();
  if(idx>=deck.length){ return finish(); }
  const q=deck[idx];
  const g=q.grade in GC ? q.grade : null;
  document.querySelector(".card").style.setProperty("--gcol", g?GC[g]:"#B9C2CC");
  const badge=$("gradeBadge");
  badge.textContent=q.grade; badge.className="badge"+(g?"":" dim");
  if(g) badge.style.background=GC[g]; else badge.style.background="";
  $("themeLbl").textContent=q.theme;
  renderWeakChip(q);
  $("qnoLbl").innerHTML=`${idx+1} / ${deck.length} · 문항 ${q.no} <span class="jarrow">▾</span>`;
  $("qText").innerHTML=esc(q.q);
  $("srcLbl").textContent="출처: "+q.src;
  $("result").classList.remove("show");
  $("nextBtn").style.display="none";
  const isMC = !["O","X"].includes(q.ans);
  const done = answers[idx];
  if(done){
    $("conceptBox").classList.remove("show");
    $("qText").style.display=""; $("srcLbl").style.display="";
    $("studyBtn").style.display="none";
    reveal(q, done.correct);
  } else if(mode==="learn"){
    $("conceptBox").classList.add("show");
    { const cc=conceptClean(q.exp); const body = cc || (q.theme && q.theme.trim()) || "이 문제의 핵심을 떠올려 보세요"; $("conceptBody").innerHTML = esc(body); }
    $("qText").style.display="none"; $("srcLbl").style.display="none";
    $("oxRow").style.display="none"; $("numRow").style.display="none";
    $("studyBtn").style.display="block";
  } else {
    $("conceptBox").classList.remove("show");
    $("qText").style.display=""; $("srcLbl").style.display="";
    $("oxRow").style.display=isMC?"none":"flex";
    $("numRow").style.display=isMC?"flex":"none";
    $("studyBtn").style.display="none";
  }
  document.querySelector(".qscroll").scrollTop=0;
}
/* 링크 이동 URL — 돌아올 지점(back)을 함께 실어보낸다 */
function jumpUrl(l, fromQno){
  let url="app.html?ch="+encodeURIComponent(l.ch);
  if(l.q) url+="&q="+encodeURIComponent(l.q);
  url+="&back="+encodeURIComponent(CH)+"&bq="+encodeURIComponent(fromQno||"");
  const bl=(document.getElementById("chTitle")||{}).textContent||CH;
  url+="&bl="+encodeURIComponent(bl.slice(0,30));
  return url;
}
function renderLinks(q){
  const box=$("linkBox"), row=$("linkRow"), srow=$("slinkRow"), lbl=$("linkLabel");
  const links=Array.isArray(q.links)?q.links:[];
  const slinks=Array.isArray(q.slinks)?q.slinks:[];
  row.innerHTML=""; srow.innerHTML="";
  if(!links.length && !slinks.length){ box.style.display="none"; return; }

  // 지문(선지)별 링크 — 각 선지가 직접 연관되는 문제로 이동
  slinks.forEach(l=>{
    const a=document.createElement("a");
    a.className="slink";
    a.href=jumpUrl(l, q.no);
    a.innerHTML=`<span class="opt">${esc(l.opt||"·")}</span><span class="lb">${esc(l.label||l.ch)}</span><span class="go">이동 ›</span>`;
    srow.appendChild(a);
  });
  // 챕터 단위 링크
  links.forEach(l=>{
    const a=document.createElement("a");
    a.textContent="▶ "+(l.label||l.ch);
    a.href=jumpUrl(l, q.no);
    row.appendChild(a);
  });
  lbl.textContent = slinks.length ? "🔗 지문별 연관 문제 바로가기" : "🔗 연관 OX 문제 바로가기";
  box.style.display="block";
}
/* 돌아가기 바 — 링크로 넘어온 경우에만 표시 */
function renderBackBar(){
  const p=new URLSearchParams(location.search);
  const back=p.get("back"), bq=p.get("bq")||"", bl=p.get("bl")||back;
  const bar=$("backBar");
  if(!back){ bar.style.display="none"; return; }
  bar.style.display="block";
  bar.textContent=`← ${bl}${bq?" · "+bq+"번":""}(으)로 돌아가기`;
  bar.onclick=()=>{
    let u="app.html?ch="+encodeURIComponent(back);
    if(bq) u+="&q="+encodeURIComponent(bq);
    location.href=u;
  };
}
renderBackBar();
function reveal(q, correct){
  const v=$("verdict"); v.className="verdict "+(correct?"ok":"no");
  $("vMark").textContent=correct?"⭕ 정답!":"❌ 오답";
  const chip=$("ansChip"); chip.textContent=q.ans;
  chip.className="anschip "+(q.ans==="O"?"O":q.ans==="X"?"X":"etc");
  $("expBox").innerHTML=renderExp(q.exp, q.kw2||q.kw);
  renderLinks(q);
  const trap = q.ans==="X" ? trapPhrase(q.exp) : null;
  if(trap){
    const raw=esc(q.q), et=esc(trap);
    if(raw.includes(et)) $("qText").innerHTML=raw.replace(et,`<mark>${et}</mark>`);
    else $("qText").innerHTML=hl(esc(q.q), q.kw, q.kwr);
  } else {
    $("qText").innerHTML=hl(esc(q.q), q.kw, q.kwr);
  }
  renderMarkBtn(q);
  renderAskBtn(q);
  $("result").classList.add("show");
  $("oxRow").style.display="none"; $("numRow").style.display="none";
  // 전 문항이 채워졌으면 위치가 덱 중간이어도 결과 화면으로 갈 수 있게 한다
  $("nextBtn").textContent = allAnswered() ? "🏁 결과 보기" : "다음 문제 →";
  $("nextBtn").style.display="block";
}
function answer(a){
  const q=deck[idx];
  if(answers[idx] || $("result").classList.contains("show")) return;
  const correct = a===q.ans;
  if(correct) ok++; else { no++; wrongs.push(q); }
  answers[idx]={a:a, correct:correct};
  // 문항별 누적 통계 즉시 저장 (중간에 꺼도 기록 유지)
  const st = S.qstat[q.no] || (S.qstat[q.no]={s:0,w:0});
  st.s++; if(!correct) st.w++;
  bumpDaily();
  saveProg();
  reveal(q, correct);
  updateHud();
  setTimeout(()=>{$("result").scrollIntoView({behavior:"smooth",block:"nearest"});},60);
}
function next(){
  if(idx<deck.length && !answers[idx]) return;
  if(allAnswered()){ idx=deck.length; show(); return; }   // 미응답이 없으면 바로 결과로
  idx++;
  if(idx<deck.length) saveProg();
  show();
}
function prev(){
  if($("doneBox").style.display==="block" && deck.length){
    $("doneBox").style.display="none"; $("card").style.display="flex";
    idx=deck.length-1; show(); return;
  }
  if(idx>0){ idx--; show(); }
}
function finish(){
  $("card").style.display="none";
  $("oxRow").style.display="none"; $("numRow").style.display="none";
  $("nextBtn").style.display="none"; $("studyBtn").style.display="none";
  $("doneBox").style.display="block";
  $("finalScore").textContent=ok; $("finalTotal").textContent=deck.length;
  const rate=deck.length?Math.round(ok/deck.length*100):0;
  $("doneMsg").textContent = rate===100 ? "완벽합니다. 이 단원은 접어두세요." :
    rate>=80 ? `정답률 ${rate}% — 오답 ${no}개만 잡으면 끝납니다.` :
    `정답률 ${rate}% — 오답 위주로 한 번 더 돌리세요.`;
  $("retryWrongBtn").style.display = wrongs.length? "block":"none";
  const nb=$("nextChBtn");
  if(NEXTCH){ nb.textContent=`다음 챕터: ${NEXTCH.title} →`; nb.style.display="block"; }
  else nb.style.display="none";
  if(CH && deck.length){
    S.rounds=(S.rounds||0)+1;
    S.best=Math.max(S.best||0, rate);
    S.last=rate; S.when=Date.now();
    S.wrongNos=wrongs.map(w=>w.no);
    S.history.push({n:S.rounds, when:Date.now(), total:deck.length, ok:ok, rate:rate, wrongNos:S.wrongNos});
    if(S.history.length>30) S.history=S.history.slice(-30);
    S.prog=null;
    save();
    updateRoundPill();
    renderHistory();
  }
}
function renderHistory(){
  if(!S.history.length){ $("histBox").style.display="none"; return; }
  $("histBox").style.display="";
  const list=$("histList"); list.innerHTML="";
  for(const h of [...S.history].slice(-5).reverse()){
    const d=new Date(h.when);
    const row=document.createElement("div"); row.className="hrow";
    row.innerHTML=`<span class="hn">${h.n}회차</span><span>${d.getMonth()+1}/${d.getDate()}</span>
      <span>${h.ok}/${h.total}</span>
      <span class="hr8" style="color:${h.rate>=80?'#2E7D32':'#C62828'}">${h.rate}%</span>
      ${h.wrongNos.length?`<span class="hw">오답 ${h.wrongNos.length}</span>`:""}`;
    list.appendChild(row);
  }
}

// 아직 안 푼 문항: 이번 세션 미응답 + 과거에도 푼 적 없음
const isTodo=(q,i)=>!answers[i] && !isSolved(q.no);
function findNextTodo(){
  const n=deck.length; if(!n) return -1;
  for(let k=1;k<=n;k++){                 // 현재 위치 다음부터 순환 탐색
    const i=(idx+k)%n;
    if(isTodo(deck[i],i)) return i;
  }
  return isTodo(deck[idx],idx) ? idx : -1; // 나머지가 다 풀렸으면 현재 확인
}
function gotoNextTodo(){
  const i=findNextTodo();
  if(i<0){ alert("이 챕터에서 안 푼 문제가 없습니다. 🎉"); return; }
  $("jumpWrap").classList.remove("show");
  jumpTo(i);
}
function openJump(){
  if(!deck.length) return;
  const g=$("jumpGrid"); g.innerHTML="";
  let todo=0;
  deck.forEach((q,i)=>{
    const b=document.createElement("button");
    b.textContent=q.no;
    const a=answers[i];
    if(i===idx) b.classList.add("cur");
    else if(a) b.classList.add(a.correct?"ok":"no");
    else if(isTodo(q,i)){ b.classList.add("todo"); todo++; }
    if(isWeak(q.no)) b.classList.add("weak");
    b.onclick=()=>{ $("jumpWrap").classList.remove("show"); jumpTo(i); };
    g.appendChild(b);
  });
  const gt=$("gotoTodoBtn");
  gt.textContent = todo>0 ? `⏭️ 안 푼 문제로 이동 (${todo})` : "✅ 모두 푼 챕터입니다";
  gt.disabled = todo===0;
  $("jumpWrap").classList.add("show");
}
function jumpTo(i){
  if(i<0 || i>=deck.length) return;
  if($("doneBox").style.display==="block"){ $("doneBox").style.display="none"; $("card").style.display="flex"; }
  idx=i;
  if(idx<deck.length) saveProg();
  show();
}
function updateHud(){
  $("okCnt").textContent=ok; $("noCnt").textContent=no;
  const p = deck.length? (answers.filter(Boolean).length/deck.length*100):0;
  $("progBar").style.width=p+"%";
}

/* ── 요약 읽어주기(TTS) + 현재 읽는 부분 하이라이트 ── */
/* 서버에서 미리 만든 구글 음성 MP3(같은 도메인 정적파일)를 재생 → iOS 사파리 확실 재생.
   음성파일 없으면 브라우저 내장 음성으로 폴백. */
let ttsSegs=[], ttsOn=false, ttsVoice=null, ttsKeep=null, ttsAudio=null, AUDIO_MAN={};
const TTS_RATE=1.05;                       // 재생 속도(자연스러움 조정)
const TTS_OK = ('speechSynthesis' in window);
fetch("audio/manifest.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(d=>{AUDIO_MAN=d||{};}).catch(()=>{});
function pickKoVoice(){
  if(!TTS_OK) return;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^ko/i.test(v.lang));
  // 자연스러운 음성 우선: Enhanced/Premium/Neural > Yuna/Google/Nara > 나머지
  ttsVoice = vs.find(v=>/enhanced|premium|neural|siri/i.test(v.name))
          || vs.find(v=>/yuna|google|nara|sora|heami/i.test(v.name))
          || vs[0] || null;
}
if(TTS_OK){ pickKoVoice(); speechSynthesis.onvoiceschanged=pickKoVoice; }
function ttsClean(t){
  // 이모지·기호 제거(읽을 때 어색함 방지), 화살표는 쉼표로
  return (t||"").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu," ")
                .replace(/\s+/g," ").trim();
}
function ttsStop(){
  ttsOn=false;
  if(TTS_OK){ try{speechSynthesis.cancel();}catch(e){} }
  if(ttsAudio){ try{ttsAudio.pause();}catch(e){} ttsAudio=null; }
  if(ttsKeep){ clearInterval(ttsKeep); ttsKeep=null; }
  ttsSegs.forEach(s=>s.classList.remove("ttsread"));
  const b=$("ttsBtn"); if(b){ b.textContent="🔊 읽어주기"; b.classList.remove("on"); }
}
function ttsStart(){
  if(!TTS_OK){ alert("이 브라우저는 음성 읽어주기를 지원하지 않습니다."); return; }
  ttsStop();
  ttsSegs=[...$("introBody").querySelectorAll("h4,p,li,.tip")];
  if(!ttsSegs.length) return;
  ttsOn=true;
  const b=$("ttsBtn"); b.textContent="⏹ 멈추기"; b.classList.add("on");
  if(!ttsVoice) pickKoVoice();
  ttsKeep=setInterval(()=>{ if(ttsOn && speechSynthesis.paused) try{speechSynthesis.resume();}catch(e){} }, 4000);
  speakSeg(0);
}
/* 오디오 엘리먼트 1개 재사용(iOS는 제스처로 한번 잠금해제되면 이후 재생 계속 허용) */
function getAudioEl(){
  if(!ttsAudio){ ttsAudio=new Audio(); ttsAudio.preload="auto"; ttsAudio.playsInline=true; }
  return ttsAudio;
}
function audioCount(){ const e=AUDIO_MAN[CH]||{}; return (e[INTRO_MODE]|0); }
function speakSeg(i){
  if(!ttsOn) return;
  ttsSegs.forEach(s=>s.classList.remove("ttsread"));
  if(i>=ttsSegs.length){ ttsStop(); return; }
  const el=ttsSegs[i], txt=ttsClean(el.textContent);
  if(!txt){ speakSeg(i+1); return; }
  el.classList.add("ttsread");
  try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  const nextSeg=()=>{ if(ttsOn) speakSeg(i+1); };
  // 미리 만든 뉴럴 음성 MP3가 있으면 그것을 재생(같은 도메인 → iOS OK)
  if(i < audioCount()){
    const a=getAudioEl(); a.playbackRate=TTS_RATE;
    let handled=false;
    const ok  =()=>{ if(handled)return; handled=true; nextSeg(); };
    const fail=()=>{ if(handled)return; handled=true; webSpeak(txt, nextSeg); }; // 없으면 내장음성
    a.onended=ok; a.onerror=fail;
    a.src=`audio/${CH}_${INTRO_MODE}_${i}.mp3`;
    const p=a.play();
    if(p&&p.catch) p.catch(fail);
  } else {
    webSpeak(txt, nextSeg);   // 음성파일 미생성 챕터 → 내장 음성
  }
}
/* 브라우저 내장 음성 폴백 */
function webSpeak(txt, cb){
  if(!TTS_OK){ cb(); return; }
  if(!ttsVoice) pickKoVoice();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="ko-KR"; if(ttsVoice) u.voice=ttsVoice; u.rate=1.0; u.pitch=1.0;
  u.onend=cb; u.onerror=cb;
  try{ speechSynthesis.speak(u); }catch(e){ cb(); }
}

  try {
    await Promise.all([pullCloud(), pullOpts()]);  // 다른 기기의 진도·필터 설정 먼저 반영
    const r = await fetch(`chapters/${CH}.json`);

    loadIntro(d.title);   // 챕터 핵심 요약 준비(초보자용) — 있으면 버튼 노출·1회 자동표시
    initChips(); applyToggleUI(); updateRoundPill(); renderHistory();
    const JUMPQ = new URLSearchParams(location.search).get("q");
    if(JUMPQ){
      // URL로 특정 문항 지정 시: 전체 덱을 구성한 뒤 해당 문항으로 바로 이동
      buildDeck();
      let i = deck.findIndex(q=>String(q.no)===String(JUMPQ));
      if(i<0){
        // 현재 필터에 걸려 빠진 문항이면 필터 무시하고 전체 덱으로 다시 구성
        deck = [...QUESTIONS];
        idx=0; ok=0; no=0; wrongs=[]; answers=[];
        $("doneBox").style.display="none"; $("card").style.display="flex";
        i = deck.findIndex(q=>String(q.no)===String(JUMPQ));
      }
      if(i>=0) jumpTo(i); else show();
      return;
    }
    // 전 문항을 다 풀었는데 결과 화면을 못 본 세션 → 바로 결과로 마무리
    if(S.prog && S.prog.nos && S.prog.nos.length && (S.prog.ans||[]).length >= S.prog.nos.length){
      resumeSession(S.prog);
      idx = deck.length; show();
      return;
    }
    // 진행중 세션이 있으면 이어하기 제안
    if(S.prog && S.prog.nos && S.prog.nos.length && (S.prog.ans||[]).length < S.prog.nos.length){
      const done=(S.prog.ans||[]).length, total=S.prog.nos.length;
      $("resumeMsg").textContent=`${total}문제 중 ${done}문제까지 풀었습니다. (${S.prog.mode==="learn"?"개념 먼저":"실전"} 모드)`;
      $("resumeBox").classList.add("show");
      $("resumeGo").onclick=()=>{$("resumeBox").classList.remove("show"); resumeSession(S.prog);};
      $("resumeFresh").onclick=()=>{$("resumeBox").classList.remove("show"); buildDeck();};
    } else {
      buildDeck();
    }
  } catch(e) {
