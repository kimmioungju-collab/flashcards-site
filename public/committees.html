<script>
(function(){
  const H="f2061d07416d140f7a4f5047a7f85188d3a8adb1e36af376c56fb5d65a337a89";
  const KEY="ox_gate_v2";
  if(localStorage.getItem(KEY)===H) return;
  document.documentElement.style.visibility="hidden";
  async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  window.addEventListener("DOMContentLoaded",async function(){
    for(let i=0;i<3;i++){
      const p=prompt("🔒 비밀번호를 입력하세요");
      if(p===null) break;
      if(await sha(p.trim())===H){ localStorage.setItem(KEY,H); document.documentElement.style.visibility=""; return; }
    }
    document.body.innerHTML="<div style='font-family:sans-serif;color:#fff;text-align:center;padding-top:40vh;font-size:18px'>🔒 접근 권한이 없습니다</div>";
    document.documentElement.style.visibility="";
  });
})();

const ATTRS=[
 {k:"num",n:"인원",big:true},{k:"rule",n:"의결"},{k:"chair",n:"위원장"},{k:"set",n:"설치"},{k:"mem",n:"위원·임기"},{k:"law",n:"누가 정하나"},{k:"fn",n:"하는 일"}
];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ruleHtml=c=>`<span class="tag" style="background:${RULES[c.rule].c}">${RULES[c.rule].n}</span>${c.ruleEx?`<br><small style="color:#C0392B;font-weight:800">예외: ${esc(c.ruleEx)}</small>`:""}`;

// ── 탭
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["all","pv","quiz","rule"].forEach(id=>document.getElementById(id).classList.toggle("hide",id!==b.dataset.tab));
});

// ── 카드
document.getElementById("legend").innerHTML=Object.entries(RULES).filter(([k])=>k!=="N").map(([k,r])=>`<span style="background:${r.c}">${r.n}</span>`).join("");
const picked=new Set();
const pickEl=document.getElementById("pick");
pickEl.innerHTML=C.map(c=>`<button data-id="${c.id}">${c.id}</button>`).join("");
pickEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  picked.has(b.dataset.id)?picked.delete(b.dataset.id):picked.add(b.dataset.id);
  b.classList.toggle("on",picked.has(b.dataset.id)); renderCards();
});
function cardHtml(c){
  const row=(k,v,cls="")=>`<div class="row ${cls}"><div class="k">${k}</div><div>${v}</div></div>`;
  return `<div class="cm" style="--rc:${RULES[c.rule].c}">
    <div class="hd"><div><div class="nm">${esc(c.nm)} <span class="st">${c.st}</span></div><div class="note"><span class="chtag">${esc(c.ch)}</span> ${esc(c.note)}</div></div>
      <div class="num"><b>${esc(c.num)}</b><small>${esc(c.numSub)}</small></div></div>
    ${row("의결",ruleHtml(c),"v")}${row("설치",esc(c.set))}${row("위원장",esc(c.chair))}${row("위원",esc(c.mem))}${row("정하나",esc(c.law))}${row("하는 일",esc(c.fn))}
    <div class="trap">⚠️ ${esc(c.trap)}</div></div>`;
}
function renderCards(){
  const list=picked.size?C.filter(c=>picked.has(c.id)):C;
  let last=null;
  document.getElementById("cards").innerHTML=list.map(c=>{
    const div=c.ch!==last?`<div class="chh">📘 공무원법 ${esc(c.ch)}</div>`:""; last=c.ch; return div+cardHtml(c);
  }).join("");
}
renderCards();

// ── 항목별
let attr="num";
const attrEl=document.getElementById("attrs");
attrEl.innerHTML=ATTRS.map(a=>`<button data-k="${a.k}" class="${a.k===attr?"on":""}">${a.n}</button>`).join("");
attrEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{attr=b.dataset.k;attrEl.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderPv();});
function renderPv(){
  const a=ATTRS.find(x=>x.k===attr);
  document.getElementById("pvt").innerHTML=C.map(c=>{
    let v=attr==="rule"?ruleHtml(c):a.big?`<span class="big">${esc(c.num)}</span> <small style="color:#9AA3AD;font-weight:800">${esc(c.numSub)}</small>`:esc(c[attr]);
    return `<tr><td style="border-left:4px solid ${RULES[c.rule].c};padding-left:8px">${esc(c.nm)}<small>${c.st} · ${esc(c.ch)}</small></td><td>${v}</td></tr>`;
  }).join("");
}
renderPv();

// ── 퀴즈: 같은 항목의 다른 위원회 값이 보기 → 실제 바꿔치기 함정 그대로
const QA=[{k:"num",n:"인원"},{k:"rule",n:"의결정족수"},{k:"chair",n:"위원장"},{k:"set",n:"설치기관"},{k:"law",n:"구성·운영을 정하는 근거"}];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const disp=(c,k)=>k==="rule"?RULES[c.rule].n:k==="num"?`${c.num} (${c.numSub})`:c[k];
let right=0,total=0,cur=null;
function newQ(){
  const k=QA[Math.floor(Math.random()*QA.length)];
  const pool=C.filter(c=>!(k.k==="rule"&&c.rule==="N")&&!(k.k==="law"&&(c.id==="근평조정"||c.id==="소청")));
  const c=pool[Math.floor(Math.random()*pool.length)];
  const ans=disp(c,k.k);
  const others=[...new Set(C.filter(x=>x!==c&&!(k.k==="rule"&&x.rule==="N")).map(x=>disp(x,k.k)).filter(v=>v!==ans))];
  const opts=shuffle([ans,...shuffle(others).slice(0,3)]);
  cur={c,k,ans};
  document.getElementById("qText").innerHTML=`<em>${esc(c.nm)}</em>의 <u>${k.n}</u>은?`;
  document.getElementById("opts").innerHTML=opts.map(o=>`<button>${esc(o)}</button>`).join("");
  document.getElementById("fb").className="fb";
  document.getElementById("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>grade(b));
  document.getElementById("score").textContent=`${right} / ${total}`;
}
function grade(b){
  if(!cur) return;
  const ok=b.textContent===cur.ans; total++; if(ok) right++;
  document.getElementById("opts").querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===cur.ans)x.classList.add("ok");else if(x===b)x.classList.add("ng");});
  const fb=document.getElementById("fb"); fb.className="fb "+(ok?"ok":"ng");
  fb.innerHTML=`${ok?"✅ 정답":"❌ 오답"} — <b>${esc(cur.ans)}</b><br>⚠️ ${esc(cur.c.trap)}`;
  document.getElementById("score").textContent=`${right} / ${total}`; cur=null;
}
document.getElementById("nxt").onclick=newQ; newQ();

// ── 함정 정리
document.getElementById("rule").innerHTML=`
<div class="card rule"><h3>① 인원수 사다리 — "조3 인5 채5 보5 고7 징9 청17"</h3>
<div class="ladder">
<div><b>3~5</b> 근평조정위 (위원장 언급 없음)</div>
<div><b>5~7</b> 인사위 · 중앙승진심사위 · 소청 상임</div>
<div><b>5~8</b> 임용심사위 · 채용비위심의위</div>
<div><b>5~9</b> 보통승진심사위</div>
<div><b>7~15</b> 고충심사위</div>
<div><b>9~15</b> 징계위 (소방청 외)</div>
<div><b>17~33</b> 징계위 (소방청)</div></div></div>
<div class="card rule"><h3>② 의결 — 색깔로 외우기</h3>
<ul><li><span style="color:var(--rA);font-weight:900">■ 재적 2/3 출석 + 과반 찬성</span> = 인사 · 승진심사 · 임용심사 <b>(세쌍둥이)</b></li>
<li><span style="color:var(--rB);font-weight:900">■ 과반 출석 + 과반 찬성</span> = 징계</li>
<li><span style="color:var(--rC);font-weight:900">■ 5명 출석 + 과반 '합의'</span> = 고충 (찬성 아님!)</li>
<li><span style="color:var(--rD);font-weight:900">■ 재적 과반 찬성</span> = 특별승진심사 · 채용비위</li>
<li><span style="color:var(--rE);font-weight:900">■ 재적 2/3 출석 + 과반 합의</span> = 중앙고충 · 소청</li></ul></div>
<div class="card rule"><h3>③ 민간위원 임기 — "징3 고2"</h3>
<ul><li>징계위 <code>3년 · 한 차례 연임</code> / 고충위 <code>2년 · 한 번 연임</code></li>
<li>인사·승진심사·임용심사·채용비위·조정위는 임기 규정 자체가 없다 → "인사위원 임기 2년" 지문은 무조건 X</li></ul></div>
<div class="card rule"><h3>④ 위원장 "포함 vs 제외"</h3>
<ul><li><b>사람 수는 전부 포함</b> (인사 5~7, 승진 5~7/5~9, 임용심사·채용비위 5~8, 고충 7~15, 징계 17~33/9~15)</li>
<li><b>비율만 제외</b>: 징계·고충 민간위원 ≥ 위원장 제외 1/2, 징계 성비위 사건 피해자 성별 위원 ≥ 위원장 제외 1/3</li>
<li>함정의 함정: 징계 <u>회의</u> 때 민간 1/2은 위원장 <b>포함</b>으로 뒤집힘 — "사람 수는 포함, 비율은 제외, 징계회의만 다시 포함"</li></ul></div>
<div class="card rule"><h3>⑤ 전체 위원 ≠ 회의 참석 — "징4 고5"</h3>
<ul><li>징계위 회의 = 위원장 + 회의마다 지정 <code>4~6명</code></li>
<li>고충위 회의 = 위원장 + 지정 <code>5~7명</code> (성별 고려, 민간 1/3 이상)</li>
<li>고충위 구성 특례(인사혁신처장 협의): 전체 5~7명, 회의 3~5명, 전원 출석 + 과반 합의</li></ul></div>
<div class="card rule"><h3>⑥ "필요한 사항은 ○○로 정한다" — 法은 대통령, 令은 부령·청장</h3>
<ul><li><b>대통령령</b> = 법에 직접 나오는 4대 위원회 (인사 §4 · 승진심사 §16 · 고충 §27 · 징계 §28)</li>
<li><b>행정안전부령</b> = 임용심사위 <b>딱 하나</b> 🚨</li>
<li><b>소방청장</b> = 채용비위심의위 · 시험 공동위원회 · 인사협의회</li>
<li>인사위 운영세칙 = 인사위 의결 거쳐 위원장 / 승진심사위 위원장 선임 = 당해 기관의 장</li></ul></div>
<div class="card rule"><h3>⑦ 위원장 두음 — "인차본 · 징차순 · 고과장 · 특민간"</h3>
<ul><li>인사위: 소방청 = <b>차</b>장, 시·도 = 소방<b>본</b>부장</li>
<li>징계위: 기관장의 <b>차순</b>위 계급자 (시·도는 소방정 이상 중 임명 가능)</li>
<li>고충위: 인사·감사 담당 <b>과장</b></li>
<li>채용비위: 시험실시권자·임용권자(또는 지명 공무원)</li>
<li>특별승진심사 시·도 보통승진심사위: 시·도지사가 <b>민간</b>위원 중 위촉</li></ul></div>`;
</script>
