<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OX 플래시카드 목차</title>
<script>
/* ── 접근 잠금 게이트 (비번 1회 입력 → 기기에 기억) ── */
(function(){
  const H="f2061d07416d140f7a4f5047a7f85188d3a8adb1e36af376c56fb5d65a337a89";
  const KEY="ox_gate_v2";
  if(localStorage.getItem(KEY)===H) return;
  document.documentElement.style.visibility="hidden";
  async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  window.addEventListener("DOMContentLoaded",async function(){
    for(let i=0;i<3;i++){
      const p=prompt("🔒 비밀번호를 입력하세요");
      if(p===null) break;
      if(await sha(p.trim())===H){
        localStorage.setItem(KEY,H);
        document.documentElement.style.visibility="";
        return;
      }
    }
    document.body.innerHTML="<div style='font-family:sans-serif;color:#fff;text-align:center;padding-top:40vh;font-size:18px'>🔒 접근 권한이 없습니다</div>";
    document.documentElement.style.visibility="";
  });
})();
</script>
<style>
:root{--desk:#2B3A4A;--desk-deep:#22303D;--paper:#FBFAF7;--ink:#1E242B;--hl:#FFE34D;--wrong:#D64550;--right:#2E75B6;--muted:#7A8694;--line:#E4E0D6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:linear-gradient(160deg,var(--desk),var(--desk-deep));min-height:100dvh;
  display:flex;justify-content:center;padding:18px 14px 40px;color:var(--ink);overflow-x:hidden}
html{overflow-x:hidden}
.wrap{width:100%;max-width:560px}
h1{color:#fff;font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.sub{color:#8497A8;font-size:12.5px;font-weight:500;margin-bottom:16px}
.search{width:100%;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 15px;font-size:14.5px;font-weight:500;
  background:rgba(255,255,255,.07);color:#fff;margin-bottom:14px;outline:none}
.search::placeholder{color:#6F8296}
.list{display:flex;flex-direction:column;gap:10px}
a.ch{display:block;background:var(--paper);border-radius:14px;padding:14px 16px 13px;text-decoration:none;color:var(--ink);
  box-shadow:0 8px 20px rgba(0,0,0,.22);position:relative;overflow:hidden}
a.ch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#DCD5C4}
/* 완료 챕터: 카드를 한 톤 눌러 "지나간 것"으로, 남은 챕터가 밝게 도드라지게 */
a.ch.done{background:#E9E4D6;box-shadow:0 3px 9px rgba(0,0,0,.15)}
a.ch.done::before{background:#2F7F63;width:5px}
a.ch.done .ctitle{color:#767C84;font-weight:600}
a.ch.done .cid{color:#BDB9AF}
a.ch.done .stat.best{color:#2F7F63;font-weight:800}
.row1{display:flex;align-items:baseline;gap:9px}
.cid{font-size:10.5px;font-weight:800;color:#B5BAC2;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.ctitle{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1;word-break:keep-all}
.podchip{flex:0 0 auto;align-self:center;border:1px solid var(--line);border-radius:7px;padding:3px 8px;
  font-size:11px;font-weight:700;background:transparent;color:#A2A7AF;cursor:pointer;line-height:1.35;white-space:nowrap}
.podchip.sum{color:#8A9099}
.podchip.done{border-color:#D3DAE1;color:#5A7285}
.podchip.wait{border-color:#E0D9BE;color:#9A8B3E}
.podchip.err{border-color:#E8D2D2;color:#B0564F}
.podtoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;max-width:86vw;
  background:rgba(20,26,34,.94);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:99px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:center}
.row2{display:flex;margin-top:7px;font-size:12px;font-weight:600;color:#A2A7AF;flex-wrap:wrap;align-items:center;
  font-variant-numeric:tabular-nums}
.stat{background:none;border-radius:0;padding:0}
.stat+.stat::before{content:"·";margin:0 6px;color:#D2D6DB}
.stat.best{color:#5A616B;font-weight:700}
.stat.new{color:#6B7280;font-weight:700}
.stat.wrong{color:#B0564F;font-weight:700}
.stat.last{color:#B5BAC2}
.grades{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.gc{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:#A2A7AF;
  background:none;border-radius:0;padding:0;font-variant-numeric:tabular-nums}
.gc::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gc,#7F7F7F);opacity:.8}
.gc b{font-weight:800;color:#6B7280}
.empty{color:#9DB0C0;text-align:center;padding:40px 0;font-weight:700}
.syncbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11.5px;font-weight:600;color:#7C8FA1}
.syncbar #syncState{flex:1}
.syncbar #syncState.on{color:#8FA9BC}
.syncbar button{border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:700;
  background:transparent;color:#8FA9BC;cursor:pointer}
/* ── 학습 플랜 카드 ── */
.plan{background:var(--paper);border-radius:16px;padding:17px 18px 11px;margin-bottom:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.24)}
.plan .ph{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.plan .ph .lab{font-size:11px;font-weight:800;letter-spacing:.17em;color:#A2A7AF}
.plan .ph .day{margin-left:auto;font-size:12px;font-weight:600;color:#8A9099;font-variant-numeric:tabular-nums}
.plan .ph .day b{font-weight:800;color:var(--ink)}
.plan .hero{display:flex;align-items:flex-end;gap:11px}
.plan .hero .big{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:.92;color:var(--ink);
  font-variant-numeric:tabular-nums}
.plan .hero .big i{font-style:normal;font-size:19px;font-weight:700;color:#A2A7AF;margin-left:1px}
.plan .hero .hsub{padding-bottom:3px;font-size:12.5px;font-weight:600;color:#8A9099;font-variant-numeric:tabular-nums}
.plan .track{position:relative;height:5px;border-radius:99px;background:#E7E3D9;margin-top:15px}
.plan .track>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ink)}
.plan .track>u{position:absolute;top:-4px;width:2px;height:13px;border-radius:2px;background:#B9B3A6;text-decoration:none}
.plan .tlab{display:flex;justify-content:space-between;gap:10px;margin-top:7px;
  font-size:11px;font-weight:600;color:#A2A7AF;font-variant-numeric:tabular-nums}
.plan .state{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:13px;font-weight:700;
  color:#4A515B;line-height:1.5;word-break:keep-all}
.plan .state .dot{width:7px;height:7px;border-radius:99px;background:#A2A7AF;flex:none;margin-top:5px}
.plan .state.ok{color:#2F7048}   .plan .state.ok .dot{background:#3E9B5F}
.plan .state.bad{color:#A93B36}  .plan .state.bad .dot{background:#C4544E}
.plan .state .thin{font-weight:600;color:#8A9099}
.plan .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:15px;
  background:var(--line);border-radius:11px;overflow:hidden}
.plan .grid>div{background:var(--paper);padding:10px 3px 9px;text-align:center}
.plan .grid .k{font-size:10.5px;font-weight:600;color:#A2A7AF;margin-bottom:3px;white-space:nowrap}
.plan .grid .v{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan .grid .v s{text-decoration:none;font-size:11.5px;font-weight:600;color:#A2A7AF}
.plan .ptime{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;
  font-size:12.5px;font-weight:700;color:#5A616B;line-height:1.55;word-break:keep-all}
.plan .ptime b{font-weight:800;color:var(--ink)}
.plan .ptime.bad b{color:#A93B36}
.plan .ptime .sub{display:block;margin-top:3px;font-weight:600;color:#A2A7AF;font-size:11.5px}
.plan .foot{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;
  display:flex;flex-direction:column;gap:9px}
.plan .gr{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.plan .gr .gl{font-size:11px;font-weight:600;color:#A2A7AF;margin-right:3px}
.plan .acts{display:flex;justify-content:flex-end;gap:2px;margin:-2px -8px -3px 0}
.plan .acts button{border:none;background:none;border-radius:8px;padding:5px 9px;
  font-size:11.5px;font-weight:700;color:#8A9099;cursor:pointer}
.plan .acts button:active{background:#EFECE3}
.plan .pgc{border:1px solid var(--line);background:transparent;color:#A2A7AF;border-radius:7px;
  padding:3px 8px;font-size:11px;font-weight:800;cursor:pointer;user-select:none}
.plan .pgc.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.plan .pmsg{font-size:13px;font-weight:600;color:#8A9099;margin-bottom:14px;line-height:1.65;word-break:keep-all}
.plan .pbtn{border:none;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:800;
  background:var(--ink);color:var(--paper);cursor:pointer}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar .search{margin-bottom:0;flex:1}
.toolbar .leftbtn{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:0 14px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.07);color:#8FA9BC;cursor:pointer;white-space:nowrap}
.toolbar .leftbtn.on{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.tools2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tools2 button{border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;
  background:transparent;color:#8497A8;cursor:pointer;white-space:nowrap}
.tools2 button.on{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:700}
/* PDF 챕터 선택 모달 */
.pdfov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.pdfbox{background:#fff;color:#1a1a1a;border-radius:16px;width:100%;max-width:420px;max-height:82vh;display:flex;flex-direction:column;padding:16px}
.pdfbox h3{margin:0 0 10px;font-size:16px}
.pdftools{display:flex;gap:8px;margin-bottom:8px}
.pdftools button{border:1px solid #d6dbe0;background:#f4f6f8;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer}
.pdflist{overflow-y:auto;flex:1;border:1px solid #eceff2;border-radius:10px;padding:4px}
.pdfrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer}
.pdfrow:active{background:#f2f7fc}
.pdfrow input{width:18px;height:18px;flex:none}
.pdfti{flex:1;font-size:13.5px;font-weight:600}
.pdfcnt{font-size:12px;font-weight:800;color:#D9A400;flex:none}
.pdfbtns{display:flex;gap:8px;margin-top:12px}
.pdfbtns button{flex:1;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;background:#eceff2;color:#333}
.pdfbtns button.pri{background:#2E75B6;color:#fff}
/* 과목 선택 화면 */
body.choose .plan,body.choose .toolbar,body.choose .tools2{display:none}
a.ch.subj{padding:17px 18px 15px}
a.ch.subj .ctitle{font-size:18px;font-weight:800;letter-spacing:-.02em}
a.ch.subj .spbar{height:4px;border-radius:99px;background:#E7E3D9;overflow:hidden;margin-top:12px}
a.ch.subj.done .spbar{background:#D6D0BF}
a.ch.subj .spbar>i{display:block;height:100%;border-radius:99px;background:var(--ink)}
a.ch.subj.fire::before{background:#B4544E}
a.ch.subj.fire .spbar>i{background:#B4544E}
a.ch.subj.rev::before{background:#2F7F63}
a.ch.subj.rev .spbar>i{background:#2F7F63}
/* 단원(편) 그룹 */
.unit{margin-bottom:4px}
.uhead{display:flex;align-items:center;gap:9px;cursor:pointer;color:#C6D5E2;font-weight:700;font-size:12.5px;
  letter-spacing:.01em;padding:14px 4px 8px;user-select:none}
.uhead .uarrow{transition:transform .15s;font-size:9px;color:#6F8296;width:10px}
.uhead.collapsed .uarrow{transform:rotate(-90deg)}
.uhead .uname{flex:1;word-break:keep-all}
.uhead .ucount{font-size:11px;font-weight:600;color:#7C8FA1;background:none;padding:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.uhead .ubar{width:44px;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;flex:none}
.uhead .ubar>i{display:block;height:100%;background:#A8BCCE}
.ubody{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.ubody.hide{display:none}
.stat.due{color:#B0564F;font-weight:800}
.stat.goal{color:#9A6A1E;font-weight:800}
a.ch.goal::before{background:#C98A2B}
/* 학습 날짜 기록 카드 */
.slog .ph{margin-bottom:0;cursor:pointer;user-select:none}
.slog .ph .day i{font-style:normal;margin-left:5px;font-size:10px;color:#B5BAC2}
.slog .sstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:15px;
  background:var(--line);border-radius:11px;overflow:hidden}
.slog .sstats>div{background:var(--paper);padding:10px 3px 9px;text-align:center}
.slog .sstats .k{font-size:10.5px;font-weight:600;color:#A2A7AF;margin-bottom:3px;white-space:nowrap}
.slog .sstats .v{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.slog .heat{display:flex;gap:3px;overflow-x:auto;padding:15px 0 3px}
.slog .hcol{display:flex;flex-direction:column;gap:3px}
.slog .hc{width:13px;height:13px;border-radius:3px;background:#EDE9DF;flex:none}
.slog .hc.l1{background:#CBD3DB}.slog .hc.l2{background:#9DAAB8}
.slog .hc.l3{background:#63778B}.slog .hc.l4{background:#2B3A4A}
.slog .hleg{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#A2A7AF;
  margin-top:9px;justify-content:flex-end}
.slog .hleg .hc{width:10px;height:10px}
.slog .srecent{font-size:11.5px;font-weight:600;color:#A2A7AF;margin-top:10px;line-height:1.7;word-break:keep-all;
  border-top:1px solid var(--line);padding-top:10px}
</style>

<body>
<div class="wrap">
  <h1>📚 OX 플래시카드</h1>
  <div class="sub" id="summary">불러오는 중…</div>
  <div class="syncbar"><span id="syncState">동기화 꺼짐</span><button id="syncBtn">코드 설정</button></div>
  <div class="plan" id="planCard" style="display:none"></div>
  <div class="plan slog" id="studyCard" style="display:none"></div>
  <div class="toolbar">
    <input class="search" id="q" placeholder="챕터 검색 (예: 비례, 신뢰보호)">
    <button class="leftbtn" id="leftBtn">남은 챕터만</button>
  </div>
  <div class="tools2">
    <button id="subjBtn" onclick="location.href='index.html'">과목 선택</button>
    <button id="goalBtn">오늘 목표만</button>
    <button id="pdfBtn">취약·체크 PDF</button>
    <button id="roundBtn">새 회독 시작</button>
    <button id="resetBtn">진도 초기화</button>
    <button id="foldBtn">단원 접기/펴기</button>
    <button id="ydayBtn" onclick="location.href='app.html?review=pick'">📅 날짜별 오답 풀기</button>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
let chapters=[];
let allChapters=[];   // 과목 필터 이전의 전체 목록 (동기화는 항상 전체 대상)
/* ── 과목 분리: ?s=admin(행정법) | fire(소방공무원법) | tactic(소방전술) | review(복습 노트, rv), 없으면 과목 선택 화면 ── */
const SUBJ=new URLSearchParams(location.search).get("s")||"";
const isFireCh=id=>/^fs/.test(id||"");
const isTacCh=id=>/^ts/.test(id||"");
const isRevCh=id=>/^rv/.test(id||"");
const isHazCh=id=>/^hz/.test(id||"");
const subjOf=id=> isFireCh(id) ? "fire" : isTacCh(id) ? "tactic" : isRevCh(id) ? "review" : isHazCh(id) ? "hazmat" : "admin";
const inSubj=c=> SUBJ ? subjOf(c.id)===SUBJ : true;
const SUBJ_NAME = SUBJ==="fire" ? "소방공무원법" : SUBJ==="tactic" ? "소방전술" : SUBJ==="review" ? "복습 노트" : SUBJ==="hazmat" ? "위험물" : "행정법";
const GC={"S":"#C00000","A":"#ED7D31","B":"#D9A400","C":"#2E75B6","기":"#70AD47","인":"#7030A0","소":"#D64550","Z":"#7F7F7F","-":"#9AA3AD","위":"#C00000","장":"#ED7D31","교":"#2E75B6","복":"#0E9F6E"};
const GORDER=["S","A","B","C","기","인","소","Z","위","장","교","복","-"];
function gradesHtml(g){
  if(!g) return "";
  const keys=Object.keys(g).sort((a,b)=>GORDER.indexOf(a)-GORDER.indexOf(b));
  if(!keys.length) return "";
  const chips=keys.map(k=>`<span class="gc" style="--gc:${GC[k]||'#7F7F7F'}">${k==="-"?"무":k} <b>${g[k]}</b></span>`).join("");
  return `<div class="grades">${chips}</div>`;
}
function stat(id){
  try{ return JSON.parse(localStorage.getItem("fc:"+id)||"null"); }catch(e){ return null; }
}
/* 1회독 커버리지: 실제로 한 번 이상 본 문항 수 (전체 등급 기준 — 목록용) */
function chSeen(c){
  const s=stat(c.id); if(!s||!s.qstat) return 0;
  let n=0; for(const k in s.qstat){ if(s.qstat[k] && s.qstat[k].s>0) n++; }
  return Math.min(n, c.count);
}
function chDone(c){ return c.count>0 && chSeen(c)>=c.count; }
let leftOnly=false, goalOnly=false;

/* ── 단원(편) 구분: 챕터 번호 범위별 ── */
const UNITS=[
  {name:"제1편 행정법 통론",        from:1,  to:12},
  {name:"제2편 행정입법",           from:13, to:15},
  {name:"제3편 행정행위·행정작용법", from:16, to:36},
  {name:"제4편 행정절차법",         from:37, to:41},
  {name:"제5편 실효성 확보수단",     from:42, to:49},
  {name:"제6편 행정쟁송(소송·심판)", from:50, to:70},
  {name:"제7편 국가배상·손실보상",   from:71, to:75},
  {name:"제8편 정보공개·개인정보",   from:76, to:81},
  {name:"제9편 기출문제",            from:82, to:99},
  {name:"📕 소방공무원법 (OX)",      from:1001, to:1050},
  {name:"📝 소방공무원법 실전문제",   from:1051, to:1099},
  {name:"🔥 화재진압·소방일반",       from:2001, to:2013},
  {name:"🧗 구조",                   from:2014, to:2020},
  {name:"🚑 구급",                   from:2021, to:2028},
  {name:"📚 복습 노트 (날짜별)",       from:3001, to:3999},
];
function chNum(c){ const n=parseInt((c.id||"").replace(/[^0-9]/g,""),10)||0; return /^fs/.test(c.id||"") ? 1000+n : /^ts/.test(c.id||"") ? 2000+n : /^rv/.test(c.id||"") ? 3000+n : n; }
function unitOf(c){ const n=chNum(c); for(const u of UNITS){ if(n>=u.from&&n<=u.to) return u; } return {name:"기타", from:9990, to:9999}; }
function foldKey(name){ return "fc:fold:"+name; }
function isFolded(name){ return localStorage.getItem(foldKey(name))==="1"; }
function setFolded(name,v){ if(v) localStorage.setItem(foldKey(name),"1"); else localStorage.removeItem(foldKey(name)); }

/* ── 등급별 계산 (플랜용) ── */
const PLAN_GRADES=["S","A","B","C","기","인","소","Z","위","장","교","-"];   // "-" = 등급없음(무), 위·장·교 = 전술 등급
/* 학습 플랜은 과목별로 따로 저장 (행정법은 기존 키/경로 유지 — 과거 데이터 호환) */
function planKey(){ return (!SUBJ||SUBJ==="admin") ? "fc:plan" : "fc:plan:"+SUBJ; }
function planPath(){ return (!SUBJ||SUBJ==="admin") ? "plan" : "plan_"+SUBJ; }
let qgrades={};   // chapterId -> { 문항no: 등급 }  (등급 필터 켤 때만 로드)
function planGradeSet(){
  const p=loadPlan();
  return (p&&Array.isArray(p.grades)&&p.grades.length)? new Set(p.grades) : null;  // null = 전체
}
let qgradesTried=false;
async function ensureQGrades(){
  // 문항별 등급은 통합 파일 1개로 받는다 (예전엔 챕터 JSON 82개를 매번 받아서 목록이 크게 느렸음)
  if(!qgradesTried){
    qgradesTried=true;
    try{
      const r=await fetch("data/qgrades.json");
      if(r.ok){ const all=await r.json(); for(const k in all) if(!qgrades[k]) qgrades[k]=all[k]; }
    }catch(e){}
  }
  const miss=chapters.filter(c=>!qgrades[c.id]);   // 통합 파일에 없는 챕터만 개별 보충
  await Promise.all(miss.map(async c=>{
    try{
      const r=await fetch(`chapters/${c.id}.json`, {cache:"no-store"});
      if(r.ok){ const d=await r.json(); const m={};
        (d.questions||[]).forEach(q=>{ m[q.no]=((q.grade||"").trim())||"-"; });
        qgrades[c.id]=m;
      } else qgrades[c.id]={};
    }catch(e){ qgrades[c.id]={}; }
  }));
}
function chCountP(c,gset){ if(!gset) return c.count||0; const g=c.grades||{}; let n=0; gset.forEach(k=>n+=(g[k]||0)); return n; }
function chSeenP(c,gset){
  const s=stat(c.id); if(!s||!s.qstat) return 0;
  if(!gset) return chSeen(c);
  const gm=qgrades[c.id]||{}; let n=0;
  for(const k in s.qstat){ const st=s.qstat[k]; if(st&&st.s>0 && gset.has(gm[k])) n++; }
  return Math.min(n, chCountP(c,gset));
}
function chDoneP(c,gset){ const t=chCountP(c,gset); return t>0 && chSeenP(c,gset)>=t; }

/* ── 오늘의 목표선 계산 ──
   플랜(N일 1회독) 기준으로, 오늘까지 끝내야 할 누적 목표 문항(targetQ)을 구하고
   챕터를 순서대로 누적해 "여기까지 하면 오늘 분량 완료"인 경계 챕터를 찾는다. */
/* 플랜 시작 시점에 이미 푼 문항(p.base)은 목표에서 제외하고, 남은 문항만 기간에 나눠 누적 목표를 잡는다.
   (플랜을 오늘부터 잡으면 "풀고 남은 문항 ÷ 일수"가 하루 페이스가 되도록) */
function planTargetAt(p, dn, totalQ){
  const days=Math.max(1,p.days);
  const base=Math.min(totalQ, Math.max(0, p.base||0));
  const d=Math.min(Math.max(dn,0),days);
  return Math.min(totalQ, base + Math.ceil(d/days*(totalQ-base)));
}
/* 플랜 저장 시 기준선 계산용: 현재 등급 조건에서 이미 푼 문항 수 (fs* 제외) */
function seenQForGrades(grades){
  const gset=(Array.isArray(grades)&&grades.length)? new Set(grades) : null;
  return chapters.filter(c=>subjOf(c.id)===(SUBJ||"admin")).reduce((s,c)=>s+chSeenP(c,gset),0);
}
function computeDailyTarget(){
  const p=loadPlan(); if(!p) return null;
  const gset=planGradeSet();
  const planChs=chapters.filter(c=>subjOf(c.id)===(SUBJ||"admin"));   // 현재 과목 챕터만 (과목 선택 화면은 행정법 기준)
  const totalQ=planChs.reduce((s,c)=>s+chCountP(c,gset),0);
  if(!totalQ) return null;
  const start=new Date(p.start+"T00:00:00");
  const today=new Date(); today.setHours(0,0,0,0);
  const dayNum=Math.floor((today-start)/86400000)+1;
  const days=Math.max(1,p.days);
  const targetQ=planTargetAt(p, Math.max(dayNum,1), totalQ);
  // 순서와 무관하게 이미 푼 문항은 건너뛰고, "앞으로 더 풀어야 할 몫"만큼만 목표선을 긋는다
  // (뒤쪽 챕터를 먼저 푼 경우 '앞섬'인데도 목표선이 계속 남던 모순 해결)
  const seenAll=planChs.reduce((s,c)=>s+chSeenP(c,gset),0);
  let need=Math.max(0, targetQ-seenAll);
  let boundaryId=null, boundaryQno=0;
  const dueSet=new Set();
  if(need>0){
    for(const c of planChs){
      const cnt=chCountP(c,gset); if(cnt<=0) continue;
      const seen=chSeenP(c,gset), un=cnt-seen;
      if(un<=0) continue;                    // 이미 다 푼 챕터는 통과
      dueSet.add(c.id);
      if(need<=un){ boundaryId=c.id; boundaryQno=Math.min(cnt, seen+need); break; }
      need-=un;
    }
  }
  return {targetQ, totalQ, boundaryId, boundaryQno, dueSet, dayNum, days};
}
let dailyT=null;   // render 시 참조

/* 챕터 카드 1개 생성 (gset: 플랜의 계산 대상 등급, null=전체) */
function makeCard(c,gset){
  const s=stat(c.id);
  const done=chDoneP(c,gset), seen=chSeenP(c,gset), cnt=chCountP(c,gset);
  const isDue = dailyT && dailyT.dueSet.has(c.id);
  const isGoal = dailyT && dailyT.boundaryId===c.id;
  const a=document.createElement("a");
  a.className="ch"+(done?" done":"")+(isGoal&&!done?" goal":"");
  a.href=`app.html?ch=${c.id}`;
  let stats="";
  if(isGoal && !done) stats += `<span class="stat goal">오늘 목표선 ~${dailyT.boundaryQno}번</span>`;
  else if(isDue && !done) stats += `<span class="stat due">오늘까지</span>`;
  if(done) stats += `<span class="stat best">✓ 완료 ${cnt}/${cnt}</span>`;
  else if(seen>0) stats += `<span class="stat new">진도 ${seen}/${cnt}</span>`;
  if(s){
    if(s.rounds) stats += `<span class="stat">${s.rounds}회독</span><span class="stat best">최고 ${s.best}%</span>`;
    const weak = s.qstat ? Object.values(s.qstat).filter(x=>x.w>0).length : 0;
    if(weak) stats += `<span class="stat wrong">취약 ${weak}문항</span>`;
    if(s.prog && s.prog.nos && (s.prog.ans||[]).length < s.prog.nos.length){
      // 이미 완료한 챕터를 다시 도는 중이면 '풀던 중'이 진도 후퇴처럼 보이므로 회독 표기로 구분
      const lbl = done ? `${(s.rounds||1)+1}회독 중` : "풀던 중";
      stats += `<span class="stat new">${lbl} ${(s.prog.ans||[]).length}/${s.prog.nos.length}</span>`;
    }
  }
  if(!stats) stats = `<span class="stat new">미학습</span>`;
  const lt = s && (s._st || s._at || s.when);
  if(lt){
    const d=new Date(lt), now=new Date();
    const ymd = d.getFullYear()!==now.getFullYear()
      ? `${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}/${d.getDate()}`
      : `${d.getMonth()+1}/${d.getDate()}`;
    stats += `<span class="stat last">${ymd}</span>`;
  }
  a.innerHTML=`<div class="row1"><span class="cid">${c.id.toUpperCase()}</span><span class="ctitle">${c.title}</span>${sumChip(c.id)}${podChip(c.id)}</div>
    <div class="row2"><span class="stat">${c.count}문항</span>${stats}</div>
    ${gradesHtml(c.grades)}`;
  return a;
}

/* ── 📖 핵심요약 칩 — 요약이 있는 챕터만 표시, 클릭 시 요약 시트 바로 열기 ── */

/* ── 🎧 AI 음성(노트북LM) 상태 표시 · 목록에서 바로 생성 ── */
const POD = {};                       // {챕터id: {status,url,mins}}
let podPollTimer = null;

function podChip(id){
  const d = POD[id], s = (d && d.status) || "none";
  if(s === "done")    return `<button class="podchip done" data-pod="${id}" title="AI 음성 듣기">음성 ${d.mins?d.mins+"분":""}</button>`;
  if(s === "running" || s === "pending") return `<button class="podchip wait" data-pod="${id}">생성중</button>`;
  if(s === "error")   return `<button class="podchip err" data-pod="${id}" title="다시 만들기">재시도</button>`;
  return `<button class="podchip" data-pod="${id}" title="AI 음성 만들기">음성 +</button>`;
}

async function podLoad(){
  try{
    const r = await fetch(`${DBURL}/flashcards/audio.json`, {cache:"no-store"});
    const d = (await r.json()) || {};
    for(const k in POD) delete POD[k];
    for(const key in d){                       // key 형식: ch01_full
      const v = d[key];
      if(v && typeof v === "object" && key.endsWith("_full")) POD[key.slice(0,-5)] = v;
    }
  }catch(e){}
}

function podPoll(){
  clearTimeout(podPollTimer);
  if(!Object.values(POD).some(v => v.status==="pending" || v.status==="running")) return;
  podPollTimer = setTimeout(async ()=>{ await podLoad(); render(podFilterVal()); podPoll(); }, 20000);
}

async function podMake(id, title){
  POD[id] = {status:"pending"};
  render(podFilterVal());
  try{
    await fetch(`${DBURL}/flashcards/audio/${id}_full.json`, {method:"PUT",
      body: JSON.stringify({status:"pending", ch:id, mode:"full", t:Date.now(), title:title||id})});
    podToast(`🎙 ${id.toUpperCase()} AI 음성을 만들기 시작했어요 (5~15분)`);
    podPoll();
  }catch(e){ POD[id] = {status:"error"}; render(podFilterVal()); podToast("요청에 실패했어요"); }
}

function podFilterVal(){ const el = document.getElementById("q"); return el ? el.value : ""; }

function podToast(msg){
  const t=document.createElement("div"); t.className="podtoast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
}

/* 칩 클릭 — 카드의 챕터 이동은 막고 칩 동작만 수행 */
document.addEventListener("click", e=>{
  const sc = e.target && e.target.closest && e.target.closest("[data-sum]");
  if(sc){ e.preventDefault(); e.stopPropagation(); location.href=`app.html?ch=${sc.dataset.sum}&summary=1`; return; }
  const chip = e.target && e.target.closest && e.target.closest("[data-pod]");
  if(!chip) return;
  e.preventDefault(); e.stopPropagation();
  const id = chip.dataset.pod, d = POD[id], s = d && d.status;
  if(s === "done" && d.url) location.href = `app.html?ch=${id}&play=1`;
  else if(s !== "pending" && s !== "running"){
    const c = chapters.find(x => x.id === id);
    podMake(id, c && c.title);
  }
}, true);
function render(filter=""){
  dailyT=computeDailyTarget();
  const gset=planGradeSet();   // 완료 판정도 플랜의 계산 대상 등급과 동일하게
  const box=document.getElementById("list");
  box.innerHTML="";
  const f=filter.trim();
  const items=chapters.filter(c=>
    (!f || c.title.includes(f) || c.id.includes(f)) &&
    (!leftOnly || !chDoneP(c,gset)) &&
    (!goalOnly || (dailyT && dailyT.dueSet.has(c.id))) );
  if(!items.length){
    const msg = goalOnly ? "오늘 할 챕터를 모두 끝냈어요 🎉"
              : leftOnly ? "남은 챕터가 없습니다 🎉" : "검색 결과가 없습니다";
    box.innerHTML='<div class="empty">'+msg+'</div>'; return;
  }
  const searching = !!f;
  // 단원별 그룹핑
  const groups=UNITS.map(u=>({u, list:items.filter(c=>unitOf(c).name===u.name)})).filter(g=>g.list.length);
  const others=items.filter(c=>unitOf(c).name==="기타");
  if(others.length) groups.push({u:{name:"기타"}, list:others});
  for(const g of groups){
    const totalC=chapters.filter(c=>unitOf(c).name===g.u.name).length;
    const doneC=chapters.filter(c=>unitOf(c).name===g.u.name && chDoneP(c,gset)).length;
    const pct=totalC?Math.round(doneC/totalC*100):0;
    const collapsed = !searching && isFolded(g.u.name);
    const unit=document.createElement("div"); unit.className="unit";
    const head=document.createElement("div");
    head.className="uhead"+(collapsed?" collapsed":"");
    head.innerHTML=`<span class="uarrow">▼</span>
      <span class="uname">${g.u.name}</span>
      <span class="ubar"><i style="width:${pct}%"></i></span>
      <span class="ucount">${doneC}/${totalC}</span>`;
    const body=document.createElement("div");
    body.className="ubody"+(collapsed?" hide":"");
    for(const c of g.list) body.appendChild(makeCard(c,gset));
    head.onclick=()=>{
      const nowFold=!body.classList.contains("hide");
      body.classList.toggle("hide",nowFold);
      head.classList.toggle("collapsed",nowFold);
      setFolded(g.u.name, nowFold);
    };
    unit.appendChild(head); unit.appendChild(body);
    box.appendChild(unit);
  }
}
/* ── 클라우드 동기화 ── */
const DBURL="https://work-schedule-dash-4ceb2-default-rtdb.firebaseio.com";
const DEFAULT_SYNC="1111";  // 개인용 앱 — 코드 미설정 기기는 이 코드로 자동 동기화
const LEGACY_SYNC="kmj";    // 예전 기본값 — 실제 진도는 1111에 있어 자동으로 옮겨준다
function syncCode(){
  const c=(localStorage.getItem("fc:synccode")||"").trim();
  if(c && c!==LEGACY_SYNC) return c;
  if(!c && localStorage.getItem("fc:syncoff")==="1") return "";   // 사용자가 직접 끈 경우만 꺼짐
  try{ localStorage.setItem("fc:synccode", DEFAULT_SYNC); }catch(e){}
  return DEFAULT_SYNC;
}
function updateSyncUI(){
  const c=syncCode(), el=document.getElementById("syncState"), btn=document.getElementById("syncBtn");
  if(c){ el.textContent="동기화 "+c; el.classList.add("on"); btn.textContent="변경/끄기"; }
  else { el.textContent="동기화 꺼짐"; el.classList.remove("on"); btn.textContent="코드 설정"; }
}
/* 빈(사실상 기록 없는) 레코드 판별 — 빈 기록이 실기록을 덮어쓰는 사고 방지용
   (2026-08-05 ch01·02 진도 소실 원인: 캐시 오래된 기기의 빈 로컬에 _at 도장 후 클라우드 덮어씀) */
function emptyRec(s){ return !s || ((s.rounds||0)===0 && !(s.history||[]).length && Object.keys(s.qstat||{}).length<=1); }
/* 푼표시(s)·오답(w)·체크(m)는 기기 간 합집합으로 보존한다.
   푼 기록이 사라지는 건 오직 '완전 초기화(새 회독)' 버튼(sreset 도장)뿐 — 동기화 경합으로는 절대 지워지지 않게 */
function mergeQstat(a,b){
  const out={}; const ks=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  ks.forEach(k=>{
    const x=(a||{})[k]||{}, y=(b||{})[k]||{};
    const m={s:Math.max(x.s||0,y.s||0), w:Math.max(x.w||0,y.w||0)};
    if(x.m||y.m) m.m=1;
    out[k]=m;
  });
  return out;
}
async function pullAll(){
  const c=syncCode(); if(!c) return;
  try{
    const r=await fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/ch.json`,{cache:"no-store"});
    if(!r.ok) return;
    const cloud=await r.json(); if(!cloud) return;
    for(const id of Object.keys(cloud)){
      const rec=cloud[id]; if(!rec) continue;
      const local=stat(id);
      const newer = !local || (rec._at||0) > (local._at||0);
      const adopt = (newer && !(emptyRec(rec) && !emptyRec(local)))   // 빈 클라우드는 실기록을 못 지움
                 || (emptyRec(local) && !emptyRec(rec));              // 빈 로컬은 시각 무관 실기록 수용
      if(adopt){
        // 완전 초기화(sreset)가 더 최신인 경우가 아니면, 로컬의 푼표시·오답·체크를 합쳐 보존
        if(local && !((rec.sreset||0) > (local.sreset||0))) rec.qstat = mergeQstat(rec.qstat, local.qstat);
        try{ localStorage.setItem("fc:"+id, JSON.stringify(rec)); }catch(e){}
      }
    }
  }catch(e){}
  // 학습 플랜도 내려받기
  try{
    const rp=await fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/${planPath()}.json`,{cache:"no-store"});
    if(rp.ok){ const cp=await rp.json(); const lp=loadPlan();
      if(cp && (cp._at||0) > ((lp&&lp._at)||0)) localStorage.setItem(planKey(), JSON.stringify(cp)); }
  }catch(e){}
  // 회독 카운터 내려받기 (큰 쪽 채택 — 다른 기기에서 새 회독 시작했을 수 있음)
  try{
    const rr=await fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/meta/roundN.json`,{cache:"no-store"});
    if(rr.ok){ const rn=parseInt(await rr.json(),10)||0;
      const lv=parseInt(localStorage.getItem("fc:roundN:admin")||"0",10);
      if(rn>lv) localStorage.setItem("fc:roundN:admin", String(rn)); }
  }catch(e){}
}
async function pushAll(){
  const c=syncCode(); if(!c) return;
  let cloud={};
  try{ const r=await fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/ch.json`,{cache:"no-store"}); if(r.ok) cloud=(await r.json())||{}; }catch(e){}
  for(const ch of (allChapters.length?allChapters:chapters)){   // 과목 화면과 무관하게 전체 동기화
    const local=stat(ch.id); if(!local) continue;
    const cl=cloud[ch.id];
    if(emptyRec(local) && !emptyRec(cl)) continue;   // 빈 로컬이 클라우드 실기록을 덮어쓰지 않게 차단
    if(local._at==null){
      if(cl) continue;                                // 시각 없는 로컬은 클라우드에 기록이 있으면 밀지 않는다
      local._at=Date.now(); try{ localStorage.setItem("fc:"+ch.id, JSON.stringify(local)); }catch(e){}
    }
    if(!cl || (local._at||0) > (cl._at||0)){
      // 클라우드에 쌓인 푼표시를 잃지 않도록 합쳐서 올린다 (완전 초기화가 더 최신이면 예외)

/* 오늘 푼 문항수 — app.html에서 답변마다 fc:daily에 날짜별로 누적 기록 */
function solvedToday(){

let DQCLOUD={};   // 클라우드 dq (날짜별 그날 처음 푼 문항)
/* 플랜 기준 '오늘 푼' — 등급 범위 안이면서 *현재 회독에 살아 있는* 문항만 센다.
   새 회독 시작(진도 초기화) 이전에 푼 문항은 진도에서 빠졌으므로 여기서도 빼야 숫자가 맞는다. */
function solvedTodayInPlan(gset){
  if(!gset) return solvedToday();
  let local={}; try{ local=JSON.parse(localStorage.getItem("fc:dq")||"{}"); }catch(e){}
  const t=todayStr();
  const byCh=Object.assign({}, (DQCLOUD[t]||{}));
  for(const id in (local[t]||{})) byCh[id]=Object.assign({}, byCh[id]||{}, local[t][id]);
  let n=0;
  for(const id in byCh){
    const gm=qgrades[id]||{}, st=stat(id), qs=(st&&st.qstat)||{};
    for(const no in byCh[id]){
      if(no==="N1") continue;
      if(gset.has(gm[no]) && qs[no] && (qs[no].s||0)>0) n++;
    }
  }
  return n;
}
/* 학습 날짜 기록 클라우드에서 병합 (기기 간 누적 유지) */
async function pullDaily(){
  const c=syncCode(); if(!c) return;
  try{
    const r=await fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/daily.json`,{cache:"no-store"});
    if(!r.ok) return;
    const cloud=await r.json(); if(!cloud) return;
    const local=loadDaily(), merged=Object.assign({},local);
    for(const k in cloud){ merged[k]=Math.max(local[k]||0, cloud[k]||0); }
    // 고유 문항 카운트 전환일: 기준값(dqbase) + 그날 처음 푼 문항수(dq)로 확정 (max 병합 안 함)
    try{
      const [rb,rq]=await Promise.all([
        fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/dqbase.json`,{cache:"no-store"}),
        fetch(`${DBURL}/flashcards/${encodeURIComponent(c)}/dq.json`,{cache:"no-store"})]);
      const base=rb.ok ? ((await rb.json())||{}) : {}, dq=rq.ok ? ((await rq.json())||{}) : {};
      DQCLOUD=dq||{};
      for(const k in base){ let n=0; for(const ch in (dq[k]||{})) n+=Object.keys(dq[k][ch]).length; merged[k]=base[k]+n; }
    }catch(e){}
    localStorage.setItem("fc:daily", JSON.stringify(merged));
  }catch(e){}
}
/* 날짜 관련 헬퍼 */
function dKey(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }
function heatLevel(n){ return n<=0?0 : n<5?1 : n<15?2 : n<30?3 : 4; }
/* 학습 날짜 기록 카드 렌더 (총 공부일·연속·최장연속 + 히트맵) */
function renderStudyLog(){
  const card=document.getElementById("studyCard"); if(!card) return;
  const d=loadDaily();
  const dates=Object.keys(d).filter(k=>d[k]>0).sort();
  if(!dates.length){ card.style.display="none"; return; }
  card.style.display="block";
  const totalDays=dates.length;
  const totalQ=dates.reduce((s,k)=>s+(d[k]||0),0);
  // 현재 연속(오늘 또는 어제부터 거꾸로) / 최장 연속
  const has=k=>!!d[k]&&d[k]>0;
  const oneDay=86400000;
  const today=new Date(); today.setHours(0,0,0,0);
  let cur=0; { let t=new Date(today);
    if(!has(dKey(t))) t=new Date(today.getTime()-oneDay); // 오늘 안 했으면 어제부터
    while(has(dKey(t))){ cur++; t=new Date(t.getTime()-oneDay); } }
  let best=0,run=0,prev=null;
  for(const k of dates){ const curDate=new Date(k+"T00:00:00");
    if(prev && (curDate-prev)===oneDay) run++; else run=1;
    if(run>best) best=run; prev=curDate; }
  // 히트맵: 최근 18주(월요일 시작 열)
  const weeks=18, cols=[];
  const end=new Date(today);
  const dow=(end.getDay()+6)%7; // 월=0
  const gridEnd=new Date(end.getTime()+(6-dow)*oneDay); // 이번 주 일요일
  const start=new Date(gridEnd.getTime()-(weeks*7-1)*oneDay);
  for(let w=0;w<weeks;w++){ let col="";
    for(let dd=0;dd<7;dd++){
      const cell=new Date(start.getTime()+(w*7+dd)*oneDay);
      const key=dKey(cell), n=d[key]||0, future=cell>today;
      const lv=future?"":("l"+heatLevel(n));
      const tip=future?"":`${key} · ${n}문항`;
      col+=`<div class="hc ${lv}" ${tip?`title="${tip}"`:""} style="${future?"visibility:hidden":""}"></div>`;
    }
    cols.push(`<div class="hcol">${col}</div>`);
  }
  const recent=dates.slice(-5).reverse().map(k=>`${k.slice(5).replace("-","/")} ${d[k]}문항`).join("  ·  ");
  // 기본은 접힘 — 제목 줄을 누르면 펼쳐지고, 선택은 이 기기에 기억된다
  const open = localStorage.getItem("fc:slogOpen") === "1";
  card.innerHTML=`
    <div class="ph" id="slogHead">
      <span class="lab">학습 기록</span>
      <span class="day">연속 <b>${cur}</b>일 · 총 <b>${totalDays}</b>일<i id="slogArrow">${open?"▾":"▸"}</i></span>
    </div>
    <div id="slogBody" style="${open?"":"display:none"}">
      <div class="sstats">
        <div><div class="k">공부한 날</div><div class="v">${totalDays}</div></div>
        <div><div class="k">현재 연속</div><div class="v">${cur}</div></div>
        <div><div class="k">최장 연속</div><div class="v">${best}</div></div>
        <div><div class="k">누적 문항</div><div class="v">${totalQ.toLocaleString()}</div></div>
      </div>
      <div class="heat">${cols.join("")}</div>
      <div class="hleg">적음 <span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span> 많음</div>
      <div class="srecent">최근 ${recent}</div>
    </div>`;
  document.getElementById("slogHead").onclick=()=>{
    const body=document.getElementById("slogBody"), arrow=document.getElementById("slogArrow");
    const nowOpen = body.style.display==="none";
    body.style.display = nowOpen ? "" : "none";
    arrow.textContent = nowOpen ? "▾" : "▸";
    try{ localStorage.setItem("fc:slogOpen", nowOpen?"1":"0"); }catch(e){}
  };
}

/* ── 공부 시간대(intraday) 페이스 ──
   플랜(N일 1회독)의 오늘 몫을 설정한 시간대(예 09:00~18:00)에 균등 배분해서
   "지금 시각까지 여기까지 풀었어야 한다"는 누적 목표 문항·경계 챕터를 계산 */
function parseHM(s){ const m=/^(\d{1,2})(?::(\d{2}))?$/.exec((s||"").trim()); if(!m) return null;
  const h=+m[1], mi=m[2]?+m[2]:0; if(h>23||mi>59) return null; return h*60+mi; }
function fmtHM(t){ return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }
function setupTimeWindow(){
  const p=loadPlan(); if(!p){ alert("먼저 학습 플랜을 설정하세요."); return; }
  const cur=(p.tstart!=null&&p.tend!=null)?`${fmtHM(p.tstart)}-${fmtHM(p.tend)}`:"09:00-18:00";
  const v=prompt("오늘 공부할 시간대를 입력하세요.\n예: 09:00-18:00 또는 9-18\n(해제하려면 '없음' 입력)", cur);
  if(v===null) return;
  const s=(v||"").trim();
  if(s==="없음"||s===""){ delete p.tstart; delete p.tend; savePlan(p); renderPlan(); return; }
  const parts=s.split(/[-~]/);
  const a=parseHM(parts[0]), b=parseHM(parts[1]);
  if(a==null||b==null||b<=a){ alert("시간 형식을 확인하세요. 예: 09:00-18:00"); return; }
  p.tstart=a; p.tend=b; savePlan(p); renderPlan();
}
function computeTimeTarget(){
  const p=loadPlan(); if(!p||p.tstart==null||p.tend==null) return null;
  const gset=planGradeSet();
  const planChs=chapters.filter(c=>subjOf(c.id)===(SUBJ||"admin"));   // 현재 과목 챕터만 (과목 선택 화면은 행정법 기준)
  const totalQ=planChs.reduce((s,c)=>s+chCountP(c,gset),0);
  if(!totalQ) return null;
  const start=new Date(p.start+"T00:00:00");
  const today=new Date(); today.setHours(0,0,0,0);
  const dayNum=Math.floor((today-start)/86400000)+1;
  const days=Math.max(1,p.days);
  const dn=Math.min(Math.max(dayNum,1),days);
  const targetToday=planTargetAt(p, dn, totalQ);
  const targetPrev=planTargetAt(p, dn-1, totalQ);
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  let frac = nowMin<=p.tstart ? 0 : nowMin>=p.tend ? 1 : (nowMin-p.tstart)/(p.tend-p.tstart);
  const intra=Math.min(totalQ, Math.round(targetPrev + frac*(targetToday-targetPrev)));
  const seenQ=planChs.reduce((s,c)=>s+chSeenP(c,gset),0);
  // 이미 푼 문항은 건너뛰고, 지금 시각까지 "더 풀어야 할 몫"만큼만 경계선을 긋는다
  let need=Math.max(0, intra-seenQ);
  let boundaryId=null, boundaryQno=0;
  if(need>0){
    for(const c of planChs){
      const cnt=chCountP(c,gset); if(cnt<=0) continue;
      const seen=chSeenP(c,gset), un=cnt-seen;
      if(un<=0) continue;
      if(need<=un){ boundaryId=c.id; boundaryQno=Math.min(cnt, seen+need); break; }
      need-=un;
    }
  }
  return {intra, targetToday, targetPrev, seenQ, diff:seenQ-intra, nowMin,
          tstart:p.tstart, tend:p.tend, boundaryId, boundaryQno, done:seenQ>=totalQ};
}

/* 현재 회독 수: '완전 초기화(새 회독)' 횟수 기반 (클라우드 동기화).
   저장값 없으면 행정법(ch*) 챕터만으로 추정 — fs 챕터가 섞이면 최솟값이 왜곡됨 */
function roundKey(){ return "fc:roundN:"+(SUBJ||"admin"); }
function currentRound(){
  const v=parseInt(localStorage.getItem(roundKey())||"0",10);
  if(v>0) return v;
  const pool=(allChapters.length?allChapters:chapters).filter(c=>subjOf(c.id)==="admin"&&(c.count||0)>0);
  const rs=pool.map(c=>(stat(c.id)||{}).rounds||0);
  let est=Math.max(1, rs.length?Math.min(...rs):1);
  // 완전 초기화 도장(sreset)이 찍혀 있으면 최소 2회독째
  if(est<2 && pool.some(c=>{const s=stat(c.id); return s&&s.sreset;})) est=2;
  return est;
}
/* 회독 완료 일자: 완료 감지 시 1회 도장 찍어 보존 (이후 재도전해도 날짜 안 밀림).
   저장값 없으면 챕터별 마지막 완료 시각의 최댓값으로 추정 */
function roundDoneDate(){
  const key="fc:roundDone:"+(SUBJ||"admin")+":"+currentRound();
  let v=parseInt(localStorage.getItem(key)||"0",10);
  if(!v){
    chapters.forEach(c=>{ if(/^fs/.test(c.id)) return; const s=stat(c.id); if(s&&s.when) v=Math.max(v,s.when); });
    if(!v) v=Date.now();
    try{ localStorage.setItem(key,String(v)); }catch(e){}
  }
  const d=new Date(v), now=new Date();
  return d.getFullYear()!==now.getFullYear()
    ? `${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}/${d.getDate()}`
    : `${d.getMonth()+1}/${d.getDate()}`;
}
function renderPlan(){
  const card=document.getElementById("planCard"); if(!card) return;
  card.style.display="block";
  const p=loadPlan();
  if(!p){
    card.innerHTML=`<div class="ph"><span class="lab">학습 플랜</span></div>
      <div class="pmsg">며칠 안에 1회독을 끝낼지 정해두면 진행률·남은 챕터·하루 권장량을 자동으로 관리합니다.</div>
      <button class="pbtn" id="planSet">플랜 시작</button>`;
    document.getElementById("planSet").onclick=setupPlan; return;
  }
  const gset=planGradeSet();  // null = 전체 등급
  const T=chapters.filter(c=>chCountP(c,gset)>0).length;
  const D=chapters.filter(c=>chDoneP(c,gset)).length;
  // 문항 기준 페이스 (등급 지정 시 해당 등급 문항만 집계)
  const totalQ=chapters.reduce((s,c)=>s+chCountP(c,gset),0);
  const seenQ=chapters.reduce((s,c)=>s+chSeenP(c,gset),0);
  const remainQ=Math.max(0, totalQ-seenQ);
  const pct=totalQ?Math.round(seenQ/totalQ*100):0;
  const start=new Date(p.start+"T00:00:00");
  const today=new Date(); today.setHours(0,0,0,0);
  const dayNum=Math.floor((today-start)/86400000)+1;   // 1일차부터
  const days=p.days;
  const dayShown=Math.min(Math.max(dayNum,1),days);
  const daysLeft=Math.max(0, days-(dayNum-1));          // 오늘 포함 남은 일수
  const end=new Date(start.getTime()+(days-1)*86400000);
  const endStr=`${end.getMonth()+1}/${end.getDate()}`;
  const targetQ=planTargetAt(p, Math.max(dayNum,1), totalQ);        // 오늘까지 누적 목표
  const targetPrev=planTargetAt(p, Math.max(dayNum-1,0), totalQ);   // 어제까지 누적 목표
  // '뒤처짐'은 어제까지 끝냈어야 할 몫 기준. 오늘 몫은 아직 진행 중이므로 뒤처짐이 아니다.
  const behindQ=Math.max(0, targetPrev-seenQ);
  const aheadQ=Math.max(0, seenQ-targetQ);
  const todayLeft=Math.max(0, targetQ-seenQ);                       // 오늘 남은 몫
  const perDayQ=daysLeft>0?Math.ceil(remainQ/daysLeft):remainQ;
  const overdue = dayNum>days;

  const N=n=>Number(n||0).toLocaleString();
  const done=seenQ>=totalQ;

  // 오늘 목표선(경계 챕터)
  const dt=computeDailyTarget();
  const boundary = (dt && dt.boundaryId && !done)
    ? `${dt.boundaryId.toUpperCase()} ${dt.boundaryQno}번까지` : "";

  // 한 줄 상태 (배지 나열 대신)
  let stTone="", stMain="", stSub="";
  if(done){ stTone="ok"; stMain=`${currentRound()}회독 완료`; stSub=`${roundDoneDate()} 마무리`; }
  else if(overdue){ stTone="bad"; stMain="기한 초과"; stSub=`남은 ${N(remainQ)}문항`; }
  else if(behindQ>0){ stTone="bad"; stMain=`${N(behindQ)}문항 뒤처짐`;
    stSub=`오늘 몫까지 ${N(todayLeft)}문항`+(boundary?` · ${boundary}`:""); }
  else if(todayLeft>0){ stTone="ok"; stMain=`오늘 ${N(todayLeft)}문항 남음`; stSub=boundary?`${boundary}`:""; }
  else { stTone="ok"; stMain=`오늘 몫 완료`; stSub=aheadQ>0?`${N(aheadQ)}문항 앞섬`:""; }

  const gsel=gset||new Set();
  const allOn=!gset;
  const present=new Set();
  chapters.forEach(c=>Object.keys(c.grades||{}).forEach(k=>{ if((c.grades[k]||0)>0) present.add(k); }));
  const chipGrades=PLAN_GRADES.filter(g=>present.has(g));
  const gchips=`<span class="pgc${allOn?" on":""}" data-g="ALL">전체</span>`+
    chipGrades.map(g=>`<span class="pgc${gsel.has(g)?" on":""}" data-g="${g}">${g==="-"?"무":g}</span>`).join("");

  // 공부 시간대 기준 실시간 페이스
  const tt=computeTimeTarget();
  let timeHtml="";
  if(tt){
    const win=`${fmtHM(tt.tstart)}~${fmtHM(tt.tend)}`, nowStr=fmtHM(tt.nowMin);
    if(tt.done){
      timeHtml=`<div class="ptime">${win} · ${currentRound()}회독을 이미 끝냈습니다
        <span class="sub">더 풀 몫이 없습니다</span></div>`;
    } else if(tt.nowMin < tt.tstart){
      timeHtml=`<div class="ptime">${win} 시작 전 · 오늘 몫 <b>${N(Math.max(0,tt.targetToday-tt.seenQ))}문항</b>
        <span class="sub">시작 시각까지 여유가 있습니다</span></div>`;
    } else {
      const behind=tt.diff<0?-tt.diff:0, ahead=tt.diff>0?tt.diff:0;
      const okNow=tt.seenQ>=tt.intra;
      const head=okNow
        ? `${nowStr} 기준 — <b>지금 몫까지 완료</b>${ahead?` (+${N(ahead)}문항)`:""}`
        : `${nowStr} 기준 — 더 풀어야 <b>${tt.boundaryId?`${tt.boundaryId.toUpperCase()} ${tt.boundaryQno}번까지`:`${N(behind)}문항`}</b>`;
      timeHtml=`<div class="ptime ${okNow?'':'bad'}">${head}
        <span class="sub">${win} 기준 누적 목표 ${N(tt.intra)} · 현재 ${N(tt.seenQ)}문항</span></div>`;
    }
  }

  const tpct = totalQ? Math.min(100, Math.round(targetQ/totalQ*100)) : 0;

  card.innerHTML=`
    <div class="ph">
      <span class="lab">학습 플랜</span>
      <span class="day">${overdue?`기한 초과 · 목표 ${days}일`
        :`<b>${dayShown}</b>일차 / ${days}일 · D-${daysLeft}`}</span>
    </div>
    <div class="hero">
      <span class="big">${pct}<i>%</i></span>
      <span class="hsub">${N(seenQ)} / ${N(totalQ)}문항</span>
    </div>
    <div class="track"><i style="width:${pct}%"></i>${
      (!done && !overdue)?`<u style="left:${tpct}%"></u>`:""}</div>
    <div class="tlab">
      <span>${(!done&&!overdue)?`오늘까지 목표 ${N(targetQ)}`:`시작 ${p.start.slice(5).replace("-","/")}`}</span>
      <span>남은 ${N(remainQ)}문항</span>
    </div>
    <div class="state ${stTone}"><span class="dot"></span><span>${stMain}${
      stSub?` <span class="thin">· ${stSub}</span>`:""}</span></div>
    <div class="grid">
      <div><div class="k">오늘 푼</div><div class="v">${N(solvedTodayInPlan(gset))}</div></div>
      <div><div class="k">하루 권장</div><div class="v">${done?"—":N(perDayQ)}</div></div>
      <div><div class="k">완료 챕터</div><div class="v">${D}<s>/${T}</s></div></div>
      <div><div class="k">종료 예정</div><div class="v">${endStr}</div></div>
    </div>
    ${timeHtml}
    <div class="foot">
      <div class="gr"><span class="gl">등급</span>${gchips}</div>
      <div class="acts">
        <button id="planTime">시간대</button>
        <button id="planEdit">설정</button>
        <button id="planReset">오늘부터</button>
      </div>
    </div>`;
  document.getElementById("planTime").onclick=setupTimeWindow;
  document.getElementById("planEdit").onclick=setupPlan;
  document.getElementById("planReset").onclick=resetPlanStart;
  card.querySelectorAll(".gr .pgc").forEach(el=>{
    el.onclick=()=>togglePlanGrade(el.dataset.g);
  });
}

/* 진도 초기화 (전체 / 특정 챕터) */
async function resetProgress(){
  const v=prompt("진도를 초기화합니다.\n\n· 전체 초기화: all 입력\n· 특정 챕터: 챕터번호 입력 (예: 3 또는 03)\n\n(취소하려면 빈칸)","");
  if(v===null) return;
  const s=(v||"").trim().toLowerCase();
  if(!s) return;
  const code=syncCode();
  if(s==="all"||s==="전체"){
    if(!confirm(`정말 ${SUBJ_NAME}의 모든 챕터 진도·회독·취약 기록을 초기화할까요?\n되돌릴 수 없습니다.`)) return;
    for(const c of chapters){   // 현재 과목 챕터만 — 다른 과목 클라우드 기록은 보존
      localStorage.removeItem("fc:"+c.id);
      if(code){ try{ await fetch(`${DBURL}/flashcards/${encodeURIComponent(code)}/ch/${c.id}.json`,{method:"PUT",body:"null"}); }catch(e){} }
    }
    localStorage.removeItem(roundKey());   // 회독 카운터도 1회독부터 다시
    if(code && SUBJ!=="fire" && SUBJ!=="tactic" && SUBJ!=="review" && SUBJ!=="hazmat"){ try{ await fetch(`${DBURL}/flashcards/${encodeURIComponent(code)}/meta/roundN.json`,{method:"PUT",body:"null"}); }catch(e){} }
    alert(`${SUBJ_NAME} 전체 진도를 초기화했습니다.`);
  } else {
    const num=s.replace(/[^0-9]/g,"");
    if(!num){ alert("챕터번호를 인식하지 못했습니다."); return; }
    const id=(SUBJ==="fire"?"fs":SUBJ==="tactic"?"ts":SUBJ==="review"?"rv":SUBJ==="hazmat"?"hz":"ch")+num.padStart(2,"0");
    const c=chapters.find(x=>x.id===id);
    if(!c){ alert("그런 챕터가 없습니다: "+id); return; }
    if(!confirm(`'${c.title}' 진도를 초기화할까요?`)) return;
    localStorage.removeItem("fc:"+id);
    if(code){ try{ await fetch(`${DBURL}/flashcards/${encodeURIComponent(code)}/ch/${id}.json`,{method:"PUT",body:"null"}); }catch(e){} }
    alert(`${id.toUpperCase()} 진도를 초기화했습니다.`);
  }
  renderPlan();
  render(document.getElementById("q").value);
}
document.getElementById("resetBtn").onclick=resetProgress;

/* 새 회독 시작: '푼 문제' 표시(s)만 리셋 → 진도 0부터 재집계.
   오답 횟수(w)·⭐체크(m)·회독수·최고점수·회차 기록은 그대로 유지 */
async function startNewRound(){
  if(!confirm(`🧨 ${SUBJ_NAME} 완전 초기화 (새 회독)\n\n· 전체 챕터가 '안 푼 상태'로 리셋되어 진도가 0%부터 다시 집계됩니다\n· 오답 횟수·⭐체크·회독수·최고점수·기록은 그대로 유지됩니다\n· 이 버튼 외에는 어떤 경우에도 푼 기록이 지워지지 않습니다\n\n전체 회독을 새로 시작할 때만 누르세요. 진행할까요?`)) return;
  const code=syncCode();
  const resetAt=Date.now();
  const newRound=currentRound()+1;   // 회독 카운터 증가 (표시용)
  try{ localStorage.setItem(roundKey(), String(newRound)); }catch(e){}
  if(code && SUBJ!=="fire" && SUBJ!=="tactic" && SUBJ!=="review" && SUBJ!=="hazmat"){ try{ await fetch(`${DBURL}/flashcards/${encodeURIComponent(code)}/meta/roundN.json`,{method:"PUT",body:String(newRound)}); }catch(e){} }
  for(const c of chapters){
    const s=stat(c.id); if(!s) continue;
    if(s.qstat){ for(const k in s.qstat){ if(s.qstat[k]) s.qstat[k].s=0; } }
    s.prog=null;   // 이전 회독의 '풀던 중' 세션 폐기
    s.sreset=resetAt;  // 완전 초기화 도장 — 이 도장이 있어야만 동기화가 푼표시 삭제를 허용한다
    if(!s._st && s._at) s._st=s._at;  // 실제 학습 시각 보존 (🕐 표시용 — 리셋 시각으로 덮지 않음)
    s._at=Date.now();
    try{ localStorage.setItem("fc:"+c.id, JSON.stringify(s)); }catch(e){}
    if(code){ try{ await fetch(`${DBURL}/flashcards/${encodeURIComponent(code)}/ch/${c.id}.json`,{method:"PUT",body:JSON.stringify(s)}); }catch(e){} }
  }
  const p=loadPlan();
  if(p && confirm("학습 플랜(N일 1회독)도 오늘부터 다시 시작할까요?")){ p.start=todayStr(); savePlan(p); }
  alert("새 회독 시작! 진도가 0%부터 다시 집계됩니다.\n(오답·체크·회독 기록은 유지)");
  renderPlan();
  render(document.getElementById("q").value);
}
document.getElementById("roundBtn").onclick=startNewRound;

/* ── 체크(⭐)한 문제 챕터별 PDF 내보내기 ── */
const _esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
function collectCheckedTargets(){
  const targets=[];  // {c, nos:Set, stat}
  for(const c of chapters){
    const s=stat(c.id); if(!s||!s.qstat) continue;
    // 취약 = 틀린 적 있거나(w>0) 직접 체크한(m) 문항
    const nos=Object.keys(s.qstat).filter(k=>{ const q=s.qstat[k]; return q&&((q.w||0)>0||q.m); });
    if(nos.length) targets.push({c, nos:new Set(nos), stat:s});
  }
  return targets;
}
/* 챕터 선택 모달 → 선택된 targets 배열 반환 (취소 시 null) */
function pickChaptersModal(targets){
  return new Promise(resolve=>{
    const rows=targets.map((t,i)=>`<label class="pdfrow">
        <input type="checkbox" class="pdfck" data-i="${i}" checked>
        <span class="pdfti">${_esc(t.c.title)}</span>
        <span class="pdfcnt">${t.nos.size}문항</span></label>`).join("");
    const ov=document.createElement("div");
    ov.className="pdfov";
    ov.innerHTML=`<div class="pdfbox">
      <h3>📄 PDF로 뽑을 챕터 선택 <small style="font-weight:600;color:#888;font-size:12px">(취약·체크 문제)</small></h3>
      <div class="pdftools"><button type="button" id="pdfAll">전체선택</button><button type="button" id="pdfNone">전체해제</button></div>
      <div class="pdflist">${rows}</div>
      <div class="pdfbtns"><button type="button" id="pdfCancel">취소</button><button type="button" id="pdfGo" class="pri">PDF 만들기</button></div>
    </div>`;
    document.body.appendChild(ov);
    const cks=()=>[...ov.querySelectorAll(".pdfck")];
    const close=v=>{ ov.remove(); resolve(v); };
    ov.querySelector("#pdfAll").onclick=()=>cks().forEach(c=>c.checked=true);
    ov.querySelector("#pdfNone").onclick=()=>cks().forEach(c=>c.checked=false);
    ov.querySelector("#pdfCancel").onclick=()=>close(null);
    ov.addEventListener("click",e=>{ if(e.target===ov) close(null); });
    ov.querySelector("#pdfGo").onclick=()=>{
      const sel=cks().filter(c=>c.checked).map(c=>targets[+c.dataset.i]);
      if(!sel.length){ alert("최소 1개 챕터를 선택하세요."); return; }
      close(sel);
    };
  });
}
async function exportCheckedPdf(){
  const btn=document.getElementById("pdfBtn");
  const allTargets=collectCheckedTargets();
  if(!allTargets.length){ alert("취약·체크 문제가 아직 없습니다.\n문제를 풀어 틀리거나(오답) 카드에서 ⭐체크하면 여기 모입니다."); return; }
  const targets=await pickChaptersModal(allTargets);
  if(!targets) return;  // 취소
  const old=btn.textContent; btn.textContent="⏳ 모으는 중…"; btn.disabled=true;
  try{
    // 각 챕터 원문 로드 후 체크 문항만 추출
    let totalQ=0; const sections=[];
    for(const t of targets){
      let data=null;
      try{ const r=await fetch(`chapters/${t.c.id}.json`, {cache:"no-store"}); if(r.ok) data=await r.json(); }catch(e){}
      const qs=((data&&data.questions)||[]).filter(q=>t.nos.has(String(q.no)));
      if(!qs.length) continue;
      totalQ+=qs.length;
      const rows=qs.map(q=>{
        const gc=GC[(q.grade||"-").trim()]||"#7F7F7F";
        const st=(t.stat.qstat&&t.stat.qstat[String(q.no)])||{};
        const tags=[];
        if((st.w||0)>0) tags.push(`<span class="wtag">오답 ${st.w}회</span>`);
        if(st.m) tags.push(`<span class="mtag">⭐체크</span>`);
        return `<div class="qitem">
          <div class="qhead"><span class="qno">${_esc(q.no)}</span>
            <span class="gbadge" style="background:${gc}">${_esc((q.grade||"-").trim()||"무")}</span>
            <span class="qtheme">${_esc(q.theme||"")}</span>${tags.join("")}</div>
          <div class="qbody">${_esc(q.q||"")}</div>
          <div class="qans"><b>정답</b> ${_esc(q.ans||"")}${q.src?` <span class="qsrc">(${_esc(q.src)})</span>`:""}</div>
          ${q.exp?`<div class="qexp"><b>해설</b> ${_esc(q.exp)}</div>`:""}
        </div>`;
      }).join("");
      sections.push(`<section class="chsec"><h2>${_esc(t.c.title)} <small>· ${qs.length}문항</small></h2>${rows}</section>`);
    }
    if(!totalQ){ alert("취약·체크 문제의 원문을 불러오지 못했습니다."); return; }

    // 3) 인쇄용 문서 생성 → 인쇄(=PDF로 저장)
    const now=new Date().toLocaleString("ko-KR",{timeZone:"Asia/Seoul"});
    const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8">
      <title>행정법 취약·체크 문제 모음</title>
      <style>
        *{box-sizing:border-box}
        body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1a1a1a;margin:0;padding:24px;line-height:1.55}
        h1{font-size:20px;margin:0 0 4px}
        .meta{color:#666;font-size:12px;margin-bottom:18px}
        .chsec{margin:0 0 22px;break-inside:avoid}
        .chsec h2{font-size:15px;background:#2E75B6;color:#fff;padding:7px 12px;border-radius:8px;margin:18px 0 10px}
        .chsec h2 small{font-weight:600;opacity:.85}
        .qitem{border:1px solid #e2e6ea;border-radius:10px;padding:11px 13px;margin:0 0 9px;break-inside:avoid}
        .qhead{display:flex;align-items:center;gap:8px;margin-bottom:5px}
        .qno{font-weight:800;font-size:13px;color:#2E75B6}
        .gbadge{color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px}
        .qtheme{color:#555;font-size:12px;font-weight:700}
        .qbody{font-size:13.5px;margin:2px 0 6px}
        .qans{font-size:12.5px;color:#111;background:#f2f7fc;border-radius:6px;padding:5px 9px;margin-bottom:5px}
        .qsrc{color:#888;font-weight:400}
        .qexp{font-size:12.5px;color:#333;background:#faf6ef;border-radius:6px;padding:5px 9px}
        b{color:#2E75B6}
        .wtag{background:#fde8e8;color:#c0392b;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px}
        .mtag{background:#fff3d6;color:#9a7400;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px}
        @media print{ body{padding:12px} @page{margin:12mm} }
      </style></head><body>
      <h1>📌 ${SUBJ_NAME} 취약·체크 문제 모음</h1>
      <div class="meta">생성 ${now} · ${targets.length}챕터 · 총 ${totalQ}문항</div>
      ${sections.join("")}
      <script>window.onload=()=>{setTimeout(()=>window.print(),400)};<\/script>
      </body></html>`;
    const w=window.open("","_blank");
    if(!w){ alert("팝업이 차단되었습니다. 팝업 허용 후 다시 시도해 주세요."); return; }
    w.document.write(html); w.document.close();
  } finally {
    btn.textContent=old; btn.disabled=false;
  }
}
document.getElementById("pdfBtn").onclick=exportCheckedPdf;

/* 통신 대기 시간 제한 —
   휴대폰 신호가 약하면 요청이 실패도 성공도 하지 않고 매달린다.
   예전에는 동기화가 다 끝나야 목록을 그려서, 그럴 때 "불러오는 중…"에서 영영 멈췄다. */
function capWait(p, ms){
  return Promise.race([ Promise.resolve(p).catch(()=>null), new Promise(res=>setTimeout(()=>res(null), ms)) ]);
}

  renderPlan(); renderStudyLog(); render(podFilterVal());
}

/* ── 과목 선택 화면 (과목별 진도 표시) ── */
function subjProgress(key){
  const list=allChapters.filter(c=>subjOf(c.id)===key);
  const gset=key==="admin"?planGradeSet():null;   // 행정법은 플랜의 등급 필터를 그대로 반영 (제외 등급은 문항수에서 뺌)
  let tq=0,sq=0,doneC=0,chN=0;
  for(const c of list){
    const cnt=chCountP(c,gset); if(cnt<=0) continue;
    chN++; tq+=cnt;
    const s=chSeenP(c,gset); sq+=s;
    if(s>=cnt) doneC++;
  }
  return {ch:chN, doneC, tq, sq, pct:tq?Math.round(sq/tq*100):0};
}
function drawSubjectSelect(){
  document.getElementById("summary").textContent="공부할 과목을 선택하세요";
  const mk=(key,label,cls)=>{
    const p=subjProgress(key);
    return `<a class="ch subj${cls?" "+cls:""}${p.tq>0&&p.sq>=p.tq?" done":""}" href="index.html?s=${key}">
      <div class="row1"><span class="ctitle">${label}</span></div>
      <div class="row2"><span class="stat">${p.ch}챕터 · ${p.tq}문항</span>
        <span class="stat best">진도 ${p.sq}/${p.tq} (${p.pct}%)</span>
        <span class="stat last">완료 챕터 ${p.doneC}/${p.ch}</span></div>
      <div class="spbar"><i style="width:${p.pct}%"></i></div></a>`;
  };
  document.getElementById("list").innerHTML =
    mk("admin","⚖️ 행정법","") + mk("fire","🚒 소방공무원법","fire") + mk("tactic","🧯 소방전술","fire") + mk("hazmat","☢️ 위험물","fire") + mk("review","📚 복습 노트","rev");
}

fetch("data/manifest.json",{cache:"no-store"}).then(r=>r.json()).then(async d=>{
  allChapters=d.chapters;
  chapters=d.chapters.filter(inSubj);
  updateSyncUI();

  if(!SUBJ){                          // 과목 선택 화면
    document.body.classList.add("choose");
    if(planGradeSet()) await capWait(ensureQGrades(), 6000);  // 등급 필터 반영에 문항별 등급 필요
    drawSubjectSelect();              // 로컬 진도로 먼저 그린다
    await capWait(pullAll(), 5000);   // 다른 기기 진도 반영 후 갱신
    if(planGradeSet()) await capWait(ensureQGrades(), 6000);  // 클라우드에서 플랜이 새로 왔을 수도
    drawSubjectSelect();
    capWait(pushAll(), 15000);        // 이 기기 진도 올리기
    return;
  }
  document.querySelector("h1").textContent = SUBJ==="fire" ? "🚒 소방공무원법 OX" : SUBJ==="tactic" ? "🧯 소방전술 기출" : SUBJ==="review" ? "📚 복습 노트" : SUBJ==="hazmat" ? "☢️ 위험물 OX" : "⚖️ 행정법 OX";
  document.title = SUBJ_NAME+" OX 플래시카드";
  drawList();                        // 목록부터 먼저 그린다 — 통신을 기다리다 갇히지 않게

  await capWait(pullAll(), 5000);    // 다른 기기 진도 반영 (최대 5초)
  await capWait(pullDaily(), 4000);  // 학습 날짜 기록 병합 (최대 4초)
  if(planGradeSet()) await capWait(ensureQGrades(), 6000);
  drawList();                        // 받아온 내용으로 다시 그린다
  capWait(pushAll(), 15000);         // 이 기기 진도 올리기 — 화면과 무관하므로 기다리지 않는다

  await capWait(Promise.all([podLoad(), sumLoad()]), 6000);  // AI 음성 상태 + 핵심요약 목록 반영
  render(podFilterVal());
  podPoll();
}).catch(()=>{
  document.getElementById("summary").innerHTML =
    "목록을 불러오지 못했습니다."
    + ` <button onclick="location.reload()" style="margin-left:6px;padding:6px 14px;border-radius:8px;border:1px solid #ccc;background:#fff">🔄 다시 시도</button>`;
});

/* 최후의 안전장치 — 12초가 지나도 목록이 안 뜨면 갇히지 않게 안내를 보여준다 */
setTimeout(()=>{
  if(document.getElementById("summary").textContent !== "불러오는 중…") return;
  document.getElementById("summary").innerHTML =
    "네트워크 응답이 없습니다."
    + ` <button onclick="location.reload()" style="margin-left:6px;padding:6px 14px;border-radius:8px;border:1px solid #ccc;background:#fff">🔄 다시 시도</button>`;
}, 12000);
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
/* 공부 시간대 페이스는 시각에 따라 바뀌므로 1분마다 갱신 */
setInterval(()=>{ const p=loadPlan(); if(p&&p.tstart!=null&&p.tend!=null&&document.getElementById("planCard")) renderPlan(); }, 60000);
</script>
